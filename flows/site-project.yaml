# flows/site-project.yaml — a WEBSITE PROJECT as a record.
#
# This flow does NOT build the site. It gets the project to the point
# where building is safe: research the client, write a brief whose
# "Done means" section the shake-out can actually be driven from, have
# it independently reviewed, and get the owner's approval.
#
# The build then happens in the SITE REPO, driven by that repo's own
# .flow/ pack (netdust/wordpress-site-pack). Two roads, because they are
# two different objects with two different lifetimes — see
# records/sites/README.md.
#
# The finish here is `launch`, sealed --fresh: the record goes `live`
# when the owner says the site is live, not when an agent thinks so.
#
# Binds: worktable (repo root), netdust_flow (runtime root),
# feature_dir (the record folder, records/sites/<slug>).

flow: site-project
version: 1

state:
  gate: {}                # last gate exit code — written by the walker

nodes:
  - id: research          # gather sources into research.md — every
    kind: agent           # claim carries its source (AGENTS.md)
    craft: [skills/sourcing-from-docs]
    out: [research.md]

  - id: gate-research     # item frontmatter valid + research.md
    kind: gate            # present with sourced content
    run: "{worktable}/bin/gate-then-status.py {feature_dir} researched -- {worktable}/bin/item-check.py {feature_dir} research"

  - id: brief             # brief.md written FROM research.md only
    kind: agent
    craft: [skills/spec-authoring]
    in: [research.md]
    out: [brief.md]

  - id: gate-brief        # structure + every claim traceable
    kind: gate
    run: "{worktable}/bin/gate-then-status.py {feature_dir} briefed -- {worktable}/bin/item-check.py {feature_dir} brief"

  - id: review            # fresh-context reviewer; verdict written
    kind: agent           # tree-bound to reviews/dossier.md (I5)
    craft: [agents/reviewer]
    in: [brief.md, research.md]
    out: [reviews/brief.md]

  - id: gate-review       # CLEAN verdict bound to the current tree
    kind: gate
    run: "{worktable}/bin/gate-then-status.py {feature_dir} reviewed --seal brief -- {worktable}/bin/review-check.py {feature_dir} brief"

  - id: approve           # yield point only — the decision is the seal
    kind: human
    out: [seal launch]

  - id: gate-seal         # the finish reads the recorded decision
    kind: gate
    run: "{worktable}/bin/gate-then-status.py {feature_dir} live -- {netdust_flow}/bin/seal.py check {feature_dir} launch --fresh"

edges:
  - {from: __start__,     to: research}
  - {from: research,      to: gate-research}
  - {from: gate-research, to: brief,    when: gate.exit == 0}
  - {from: gate-research, to: research, when: gate.exit != 0}
  - {from: brief,         to: gate-brief}
  - {from: gate-brief,    to: review,   when: gate.exit == 0}
  - {from: gate-brief,    to: brief,    when: gate.exit != 0}
  - {from: review,        to: gate-review}
  - {from: gate-review,   to: approve,  when: gate.exit == 0}
  - {from: gate-review,   to: brief,    when: gate.exit != 0}
  - {from: approve,       to: gate-seal}
  - {from: gate-seal,     to: __end__,  when: gate.exit == 0}
  - {from: gate-seal,     to: brief,    when: gate.exit == 2}
  - {from: gate-seal,     to: approve,  when: gate.exit == 1}
