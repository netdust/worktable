# .flow/floors.yaml — dispatch floors for a WordPress site.
#
# Work matching any category MUST take the full `site` road rather than
# a quick patch. The agent may route work UP; never down.
#
# These are tuned for WordPress specifically — which is exactly why they
# live in the project pack and not in the runtime.
floors:
  auth:
    paths: ["**/wp-login*", "**/*capabilit*", "**/*-auth*"]
    content: ['current_user_can', 'wp_set_auth_cookie', 'wp_signon',
              'add_role', 'add_cap', 'map_meta_cap', 'wp_verify_nonce']
  user-input:
    content: ['\$_(POST|GET|REQUEST|FILES|COOKIE)\b', 'wp_ajax_',
              'admin_post_', 'register_rest_route', 'sanitize_', 'wp_unslash']
  schema:
    paths: ["**/migrations/**", "**/install*.php", "**/upgrade*.php"]
    content: ['dbDelta', 'CREATE TABLE', 'ALTER TABLE', 'register_post_type',
              'register_taxonomy', 'add_option\(']
  payments:
    content: ['stripe', 'mollie', 'paypal', 'woocommerce_order',
              'payment_intent', 'wc_get_order', 'WC_Payment']
  # Uploads and shortcodes both take arbitrary input from places the
  # theme author did not write, which is the same risk with a friendlier
  # name.
  untrusted-content:
    content: ['wp_handle_upload', 'media_handle_upload', 'add_shortcode',
              'do_shortcode', 'file_get_contents\s*\(\s*\$', 'unserialize\s*\(']
