# .flow/flows/site.yaml — building a WordPress site, gated.
#
# The shape of netdust-flow's `deliver` road, with this project's gates
# in place of the generic ones. The runtime supplies the machine; this
# file and .flow/bin/ supply everything that knows the word "WordPress".
#
# The bet: everything a machine can check is checked BEFORE the work
# reaches a human, so the human's attention is spent on the one thing a
# machine cannot judge — whether it looks right and reads right.
#
# Binds: netdust_flow (runtime root), feature_dir (the build folder),
#        theme (the theme slug), base_ref (diff base for the scans).

flow: site
version: 1

state:
  gate: {}                # last gate exit code — written by the walker

nodes:
  - id: brief             # what the site is FOR: audience, pages,
    kind: agent           # content sources, constraints, the brand
    craft: [.flow/craft/site-builder.md]
    out: [spec.md]

  - id: gate-brief        # structure + acceptance criteria + the review
    kind: gate            # cluster (I5) — refuses a plan without one
    run: ".flow/bin/spec-gate.py {feature_dir}"

  - id: plan
    kind: agent
    craft: [.flow/craft/site-builder.md]
    in: [spec.md]
    out: [plan.md, tasks.md]

  - id: gate-plan
    kind: gate
    run: ".flow/bin/spec-gate.py {feature_dir}"

  - id: approve-plan      # yield point only — the decision is the seal.
    kind: human           # A site is scope, budget and a client
    out: [seal approve-plan]   # promise; it gets approved before code.

  - id: gate-approval
    kind: gate
    run: "{netdust_flow}/bin/seal.py check {feature_dir} approve-plan"

  - id: build             # the loop body: one task, its check, its
    kind: agent           # attest. Reviews are ledger tasks (I5).
    craft:
      - .flow/craft/site-builder.md
      - .flow/craft/wp-reviewer.md
    in: [tasks.md]
    out: [theme, checked tasks]

  - id: gate-ledger       # every task attested, suite green on HEAD
    kind: gate
    run: "{netdust_flow}/bin/ledger.py {feature_dir}"
    # exit 0 finished · 1 continue · 2 a [HUMAN] task blocks

  - id: unblock
    kind: human
    out: [resolved task]

  # ── the four machine gates, cheapest first ──────────────────────────
  # Ordered so the fastest failure happens first: a syntax error should
  # not wait for a browser to boot.

  - id: gate-syntax       # php -l over the changed files
    kind: gate
    run: ".flow/bin/wp-lint.sh {base_ref}"

  - id: gate-security     # escaping · nonces · capabilities · SQL
    kind: gate
    run: ".flow/bin/wp-security.py --base {base_ref}"

  - id: gate-standards    # PHPCS / WordPress-Coding-Standards
    kind: gate
    run: ".flow/bin/wp-standards.sh {base_ref}"

  - id: gate-render       # real WP boots, every route renders, no new
    kind: gate            # lines in debug.log
    run: ".flow/bin/wp-render.sh {theme}"

  - id: gate-a11y         # landmarks, alt text, labels, heading order,
    kind: gate            # no 360px overflow
    run: ".flow/bin/wp-a11y.sh"

  - id: shakeout          # THE HUMAN PART. Everything above is green,
    kind: human           # so this is about whether it looks right —
    craft: [.flow/craft/site-builder.md]
    out: [seal shakeout]

  - id: gate-acceptance   # the finish reads the recorded decision, and
    kind: gate            # --fresh means a post-seal edit re-asks
    run: "{netdust_flow}/bin/seal.py check {feature_dir} shakeout --fresh"

edges:
  - {from: __start__,       to: brief}
  - {from: brief,           to: gate-brief}
  - {from: gate-brief,      to: plan,          when: gate.exit == 0}
  - {from: gate-brief,      to: brief,         when: gate.exit != 0}
  - {from: plan,            to: gate-plan}
  - {from: gate-plan,       to: approve-plan,  when: gate.exit == 0}
  - {from: gate-plan,       to: plan,          when: gate.exit != 0}
  - {from: approve-plan,    to: gate-approval}
  - {from: gate-approval,   to: build,         when: gate.exit == 0}
  - {from: gate-approval,   to: plan,          when: gate.exit == 2}
  - {from: gate-approval,   to: approve-plan,  when: gate.exit == 1}
  - {from: build,           to: gate-ledger}
  - {from: gate-ledger,     to: build,         when: gate.exit == 1}
  - {from: gate-ledger,     to: unblock,       when: gate.exit == 2}
  - {from: gate-ledger,     to: gate-syntax,   when: gate.exit == 0}
  - {from: unblock,         to: gate-ledger}

  # Every machine gate routes its failure back to `build`. There is no
  # edge that carries a red check forward, and no edge that lets a human
  # wave one through: the shake-out is reachable only from a green a11y
  # gate, which is reachable only from a green render gate, and so on
  # back to syntax. That chain IS the trust claim.
  - {from: gate-syntax,     to: gate-security, when: gate.exit == 0}
  - {from: gate-syntax,     to: build,         when: gate.exit != 0}
  - {from: gate-security,   to: gate-standards, when: gate.exit == 0}
  - {from: gate-security,   to: build,         when: gate.exit != 0}
  - {from: gate-standards,  to: gate-render,   when: gate.exit == 0}
  - {from: gate-standards,  to: build,         when: gate.exit != 0}
  - {from: gate-render,     to: gate-a11y,     when: gate.exit == 0}
  - {from: gate-render,     to: build,         when: gate.exit != 0}
  - {from: gate-a11y,       to: shakeout,      when: gate.exit == 0}
  - {from: gate-a11y,       to: build,         when: gate.exit != 0}

  - {from: shakeout,        to: gate-acceptance}
  - {from: gate-acceptance, to: __end__,       when: gate.exit == 0}
  - {from: gate-acceptance, to: build,         when: gate.exit == 2}
  - {from: gate-acceptance, to: shakeout,      when: gate.exit == 1}
