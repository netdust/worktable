<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tijdlijn Tourstops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the app shell; tourstops as bars on one lane per production, a day or week scale on top, today as a line, the record drawer open on the right. */
/* Token names follow apps/grid/src/ui/theme.css and design/grid-prototype.html, the approved design language. Invented data only. */
:root {
  --font-sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --color-bg-canvas: #eef0f3;
  --color-bg-surface: #ffffff;
  --color-bg-subtle: #f6f7f9;
  --color-bg-muted: #eceff3;
  --color-bg-sidebar: #f7f8fa;
  --color-bg-hover: #eef2f7;
  --color-bg-selected: #e6eef8;
  --color-fg-default: #1b2128;
  --color-fg-muted: #4f5964;
  --color-fg-subtle: #8a939d;
  --color-fg-on-accent: #ffffff;
  --color-border-subtle: #e7eaee;
  --color-border-default: #d9dee4;
  --color-border-strong: #c4cbd3;
  --color-accent-default: #2563ab;
  --color-accent-hover: #1d4f8c;
  --color-accent-subtle: #e6eef8;
  --color-success-fg: #1e7a45;
  --color-success-bg: #e2f2e8;
  --color-warning-fg: #8f6100;
  --color-warning-bg: #fbefd2;
  --color-danger-fg: #b0302f;
  --color-danger-bg: #f8e1e1;
  --color-band: #f1f3f6;
  --color-bg-card: #ffffff;
  --color-bg-column: #f3f4f7;
  --shadow-pop: 0 8px 28px rgba(20, 30, 45, .16), 0 1px 3px rgba(20, 30, 45, .1);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --row-h: 40px;
  /* soort, one hue each */
  --s-voorstelling: #c2416b;
  --s-repetitie: #6d4fc2;
  --s-opbouw: #b7791f;
  --s-afbouw: #a0612a;
  --s-reis: #2b7bb9;
  --s-overnachting: #5b6675;
  --s-maaltijd: #2f8a57;
  --s-vergadering: #138a8a;
  --s-andere: #7a838d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg-canvas: #0e0f11; --color-bg-surface: #16171a; --color-bg-subtle: #1b1c20; --color-bg-muted: #24262b;
    --color-bg-sidebar: #0b0c0e; --color-bg-hover: #222429; --color-bg-selected: #1f2b3d; --color-bg-card: #202126; --color-bg-column: #16171a;
    --color-fg-default: #ececf0; --color-fg-muted: #a4a7b0; --color-fg-subtle: #6c707a; --color-fg-on-accent: #ffffff;
    --color-border-subtle: #24262b; --color-border-default: #2c2e34; --color-border-strong: #3a3d44;
    --color-accent-default: #5b9be0; --color-accent-hover: #7db0e8; --color-accent-subtle: #1c2b3d;
    --color-success-fg: #6cc893; --color-success-bg: #173324; --color-warning-fg: #e2b54f; --color-warning-bg: #352a12;
    --color-danger-fg: #ee8a89; --color-danger-bg: #3a1c1c; --color-band: #1a1b1f;
    --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-bg-canvas: #0e0f11; --color-bg-surface: #16171a; --color-bg-subtle: #1b1c20; --color-bg-muted: #24262b;
  --color-bg-sidebar: #0b0c0e; --color-bg-hover: #222429; --color-bg-selected: #1f2b3d; --color-bg-card: #202126; --color-bg-column: #16171a;
  --color-fg-default: #ececf0; --color-fg-muted: #a4a7b0; --color-fg-subtle: #6c707a; --color-fg-on-accent: #ffffff;
  --color-border-subtle: #24262b; --color-border-default: #2c2e34; --color-border-strong: #3a3d44;
  --color-accent-default: #5b9be0; --color-accent-hover: #7db0e8; --color-accent-subtle: #1c2b3d;
  --color-success-fg: #6cc893; --color-success-bg: #173324; --color-warning-fg: #e2b54f; --color-warning-bg: #352a12;
  --color-danger-fg: #ee8a89; --color-danger-bg: #3a1c1c; --color-band: #1a1b1f;
  --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

:root { --drawer-w: 392px; --today: #d9480f }
:root[data-theme="dark"] { --today: #ff8a4c }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --today: #ff8a4c } }

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--color-bg-canvas); color: var(--color-fg-default); font: 13.5px/1.4 var(--font-sans); overflow: hidden }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--color-accent-default); outline-offset: 1px }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr) 0; height: 100%; transition: grid-template-columns .18s ease }
.app.with-drawer { grid-template-columns: 268px minmax(0, 1fr) var(--drawer-w) }

/* ---------- sidebar ---------- */
.side { background: var(--color-bg-sidebar); border-right: 1px solid var(--color-border-default); display: flex; flex-direction: column; min-height: 0 }
.brand { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; font-size: 12px; color: var(--color-fg-subtle); letter-spacing: .04em; text-transform: uppercase }
.brand b { color: var(--color-fg-default); letter-spacing: 0; text-transform: none; font-size: 13px }
.space { margin: 6px 10px 10px; position: relative }
.space-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); cursor: pointer; text-align: left }
.space-btn:hover { border-color: var(--color-border-strong) }
.space-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--color-fg-on-accent); background: var(--space-color, var(--color-accent-default)); flex: none }
.space-text { display: flex; flex-direction: column; min-width: 0; flex: 1 }
.space-text strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.space-text small { color: var(--color-fg-subtle); font-size: 11.5px }
.tree { overflow: auto; flex: 1; padding: 2px 8px 16px }
.section-label { padding: 14px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-subtle) }
.node { position: relative }
.model { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 2px; border-radius: var(--radius-sm); cursor: pointer; user-select: none }
.model:hover { background: var(--color-bg-hover) }
.lead { width: 20px; height: 20px; display: grid; place-items: center; position: relative; flex: none }
.lead > * { position: absolute; display: grid; place-items: center }
.model .glyph { color: var(--color-fg-muted) }
.chev { color: var(--color-fg-muted); opacity: 0; transition: transform .12s }
.node.open > .model .chev { transform: rotate(90deg) }
.model:hover .chev { opacity: 1 }
.model:hover .glyph { opacity: 0 }
.model .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500 }
.model .count { font: 11px var(--font-mono); color: var(--color-fg-subtle) }
.views { display: none; padding: 1px 0 4px 26px; position: relative }
.views::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 6px; border-left: 1px solid var(--color-border-default) }
.node.open > .views { display: block }
.view { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-fg-muted); text-decoration: none }
.view:hover { background: var(--color-bg-hover); color: var(--color-fg-default) }
.view.active { background: var(--color-bg-selected); color: var(--color-accent-default); font-weight: 500 }
.view .vname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.view .lock { color: var(--color-fg-subtle); display: inline-flex }
.view.dash { padding-left: 4px; color: var(--color-fg-default) }
.side-foot { border-top: 1px solid var(--color-border-default); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-fg-muted) }

/* ---------- people ---------- */
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent-subtle); color: var(--color-accent-default); display: inline-grid; place-items: center; font-weight: 600; font-size: 10.5px; flex: none; letter-spacing: .01em }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; letter-spacing: 0 }
.avatar.open { background: transparent; border: 1px dashed var(--color-border-strong); color: var(--color-fg-subtle) }
.stack { display: inline-flex }
.stack .avatar { box-shadow: 0 0 0 2px var(--color-bg-card) }
.stack .avatar + .avatar { margin-left: -2px }
.stack .more { font-size: 11px; color: var(--color-fg-subtle); margin-left: 6px; align-self: center }
.who { display: inline-flex; align-items: center; gap: 6px }

/* ---------- popovers ---------- */
.pop { position: fixed; z-index: 60; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 4px; min-width: 200px }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--color-fg-default) }
.pop-item:hover:not([disabled]) { background: var(--color-bg-hover) }
.pop-item[disabled] { color: var(--color-fg-subtle); cursor: default }
.pop-item .meta { margin-left: auto; color: var(--color-fg-subtle); font-size: 11.5px }
.pop-item.current { font-weight: 600 }
.pop-item.current::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-default) }
.pop-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none }
.pop-sep { height: 1px; background: var(--color-border-subtle); margin: 4px 2px }
.pop-head { padding: 6px 10px 4px; font-size: 11px; color: var(--color-fg-subtle); text-transform: uppercase; letter-spacing: .06em; font-weight: 600 }
.pop-search { width: 100%; padding: 7px 10px; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); background: var(--color-bg-subtle); margin-bottom: 4px; font: inherit; color: inherit }
.pop-check { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer }
.pop-check:hover { background: var(--color-bg-hover) }
.pop-check input { accent-color: var(--color-accent-default); margin: 0 }
.pop-check .meta { margin-left: auto; color: var(--color-fg-subtle); font-size: 11.5px }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border-default); background: var(--color-bg-surface); cursor: pointer; white-space: nowrap; color: var(--color-fg-default) }
.btn:hover { border-color: var(--color-border-strong); background: var(--color-bg-subtle) }
.btn.primary { background: var(--color-accent-default); border-color: var(--color-accent-default); color: var(--color-fg-on-accent) }
.btn.primary:hover { background: var(--color-accent-hover) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--color-fg-muted) }
.btn.ghost:hover { background: var(--color-bg-hover); color: var(--color-fg-default) }
.btn.sm { padding: 3px 9px; font-size: 12.5px }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); color: var(--color-fg-muted); cursor: pointer; flex: none }
.iconbtn:hover { border-color: var(--color-border-strong); color: var(--color-fg-default) }
.iconbtn.on { color: var(--color-accent-default); border-color: var(--color-accent-default) }
.tool { width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-fg-muted); flex: none }
.tool:hover { background: var(--color-bg-muted); color: var(--color-fg-default) }
.seg { display: inline-flex; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 2px; gap: 2px; background: var(--color-bg-surface) }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-size: 12.5px; border-radius: var(--radius-sm); color: var(--color-fg-muted) }
.seg button:hover { color: var(--color-fg-default) }
.seg button.on { background: var(--color-bg-muted); color: var(--color-fg-default); font-weight: 600 }
kbd { font: 10.5px var(--font-mono); border: 1px solid var(--color-border-default); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--color-fg-subtle) }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.top { background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-default); padding: 10px 18px; display: flex; align-items: center; gap: 10px; min-height: 55px }
.top .spacer { display: none }
.title .sum, .title .on-model, .insight { flex: none }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; overflow: hidden }
.title .tglyph { width: 30px; height: 30px; border-radius: var(--radius-md); background: var(--color-bg-muted); display: grid; place-items: center; color: var(--color-fg-default); flex: none }
.title h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap }
.title .sum { font-size: 12px; color: var(--color-fg-muted); background: var(--color-bg-muted); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; white-space: nowrap }
.title .on-model { font-size: 12.5px; color: var(--color-fg-subtle); white-space: nowrap }
.lockmark { color: var(--color-fg-subtle); display: inline-flex }
.insight { font-size: 12px; color: var(--color-fg-muted); white-space: nowrap }
.insight b { color: var(--color-danger-fg); font-weight: 600 }
.insight.warn b { color: var(--color-warning-fg) }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 5px 8px; color: var(--color-fg-subtle); flex: 0 1 200px; min-width: 120px; background: var(--color-bg-surface) }
.search:focus-within { border-color: var(--color-accent-default) }
.search input { border: 0; background: transparent; outline: 0; font: inherit; color: var(--color-fg-default); width: 100% }

.bar { padding: 8px 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--color-border-default); background: var(--color-bg-surface) }
.bar .grow { flex: 1 }
.bar .rows { color: var(--color-fg-subtle); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
.bar .iconbtn { width: 28px; height: 28px }
.bar .divider { width: 1px; height: 18px; background: var(--color-border-default); margin: 0 2px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--color-border-default); color: var(--color-fg-muted); font-size: 12.5px; background: var(--color-bg-surface); cursor: pointer; white-space: nowrap }
.chip:hover { border-color: var(--color-border-strong); color: var(--color-fg-default) }
.chip.set { border-color: transparent; background: var(--color-accent-subtle); color: var(--color-accent-default) }
.chip.scope { border-color: transparent; background: var(--color-bg-muted); color: var(--color-fg-default) }
.chip.scope i { width: 8px; height: 8px; border-radius: 2px; background: var(--c) }
.chip .op { opacity: .75 }
.chip b { font-weight: 600 }
.chip .x { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px 0 0; border-radius: 50%; opacity: .7 }
.chip .x:hover { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent) }
.chip .x .icon, .chip > .icon.down { width: 12px; height: 12px }
.chip .count { font: 600 11px var(--font-mono); background: var(--color-accent-default); color: var(--color-fg-on-accent); border-radius: 999px; padding: 0 5px; margin-left: 2px }
.chip .lbl { color: var(--color-fg-subtle) }
.chip.set .lbl { color: inherit; opacity: .75 }

.stage { flex: 1; min-height: 0; overflow: auto; position: relative }
.foot { background: var(--color-bg-subtle); border-top: 1px solid var(--color-border-default); padding: 6px 18px; font-size: 12px; color: var(--color-fg-subtle); display: flex; gap: 16px; white-space: nowrap; overflow: hidden }
.foot .r { margin-left: auto }

/* ---------- facts ---------- */
.time { font: 12.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-default) }
.time .end { color: var(--color-fg-subtle) }
.soort { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px }
.soort i { width: 8px; height: 8px; border-radius: 2px; flex: none }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.optie { color: var(--color-warning-fg); background: var(--color-warning-bg) }
.pill.bevestigd { color: var(--color-success-fg); background: var(--color-success-bg) }
.pill.geannuleerd { color: var(--color-danger-fg); background: var(--color-danger-bg) }
.pill.neutral { color: var(--color-fg-muted); background: var(--color-bg-muted) }
.alert-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--color-danger-fg); background: var(--color-danger-bg); white-space: nowrap }
.alert-badge .icon { width: 13px; height: 13px; stroke-width: 1.9 }
.inherited { color: var(--color-fg-subtle); font-style: italic }
.via { font-style: normal; font-size: 10.5px; border: 1px solid var(--color-border-default); border-radius: 3px; padding: 0 4px; color: var(--color-fg-subtle); margin-left: 4px }
.meter { width: 42px; height: 5px; border-radius: 3px; background: var(--color-bg-muted); overflow: hidden; display: inline-block }
.meter b { display: block; height: 100%; background: var(--color-success-fg) }
.meter.short b { background: var(--color-warning-fg) }
.crew { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-muted) }
.prod-tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.prod-tag i { width: 6px; height: 14px; border-radius: 2px; background: var(--c) }
.muted { color: var(--color-fg-subtle) }

/* ---------- filter builder ---------- */
.fb { width: 560px; padding: 10px }
.fb-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--color-fg-subtle); margin: 0 2px 8px }
.fb-row { display: grid; grid-template-columns: 40px 128px 128px 1fr 26px; gap: 6px; align-items: start; margin-bottom: 6px }
.fb-row .where { font-size: 12px; color: var(--color-fg-subtle); padding-top: 7px; text-align: right }
.fb select, .fb input[type=text] { height: 30px; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); background: var(--color-bg-surface); color: var(--color-fg-default); font: inherit; padding: 0 6px; width: 100% }
.fb .add { margin-top: 4px; border: 0; background: none; color: var(--color-accent-default); cursor: pointer; padding: 4px 2px; font: inherit }
.fb .toks { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); padding: 3px 4px }
.fb .tok { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--color-accent-subtle); color: var(--color-accent-default); font-size: 12px; font-weight: 500; border: 0; cursor: pointer }
.fb .tok.off { background: transparent; color: var(--color-fg-muted); border: 1px dashed var(--color-border-default) }
.fb-x { width: 26px; height: 30px; border: 0; background: none; color: var(--color-fg-subtle); cursor: pointer; display: grid; place-items: center }
.fb-x:hover { color: var(--color-danger-fg) }

/* ---------- record drawer: a side panel, part of the layout ---------- */
.drawer { background: var(--color-bg-surface); border-left: 1px solid var(--color-border-default); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden }
.app:not(.with-drawer) .drawer { visibility: hidden }
.dw-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--color-border-subtle); font-size: 12px; color: var(--color-fg-subtle) }
.dw-head .kind { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0 }
.dw-head .pos { font: 11px var(--font-mono) }
.dw-body { overflow: auto; flex: 1; padding: 16px 16px 24px }
.dw-title { font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; margin: 0 0 4px; outline: 0; border-radius: var(--radius-sm) }
.dw-title:hover { background: var(--color-bg-hover); box-shadow: 0 0 0 4px var(--color-bg-hover) }
.dw-sub { color: var(--color-fg-muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 14px }
.dw-hero { margin: -16px -16px 14px; height: 200px; overflow: hidden; border-bottom: 1px solid var(--color-border-subtle) }
.dw-hero svg { width: 100%; height: 100%; display: block }
.dw-alert { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-danger-bg); color: var(--color-danger-fg); font-size: 12.5px; margin-bottom: 14px }
.dw-alert b { font-weight: 600; display: block; margin-bottom: 2px }
.dw-alert .acts { display: flex; gap: 12px; margin-top: 6px }
.dw-alert .acts button { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: 12.5px; font-weight: 500 }
.dw-alert.warn { background: var(--color-warning-bg); color: var(--color-warning-fg) }
.props { display: grid; grid-template-columns: 112px 1fr; margin: 0 0 18px }
.props dt { color: var(--color-fg-subtle); font-size: 12.5px; padding: 7px 0; display: flex; align-items: center; gap: 7px }
.props dt .icon { width: 14px; height: 14px }
.props dd { margin: 0; padding: 4px 6px; min-height: 32px; display: flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); cursor: text; flex-wrap: wrap }
.props dd:hover { background: var(--color-bg-hover) }
.props dd.ro { cursor: default }
.props dd.ro:hover { background: none }
.dw-sec { border-top: 1px solid var(--color-border-subtle); padding-top: 12px; margin-top: 4px; margin-bottom: 16px }
.dw-sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-subtle); display: flex; align-items: center; gap: 8px }
.dw-sec h3 .n { font: 11px var(--font-mono); letter-spacing: 0; color: var(--color-fg-muted); background: var(--color-bg-muted); border-radius: 4px; padding: 0 5px }
.dw-sec h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; color: var(--color-accent-default); cursor: pointer }
.dw-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.dw-list li { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: var(--radius-sm); min-height: 36px }
.dw-list li:hover { background: var(--color-bg-hover) }
.dw-list .main-t { flex: 1; min-width: 0; display: grid }
.dw-list .main-t span { font-size: 12px; color: var(--color-fg-subtle) }
.dw-list li.open-slot { color: var(--color-fg-muted) }
.dw-list li.open-slot .fill { margin-left: auto; color: var(--color-accent-default); font-size: 12.5px; font-weight: 500; border: 0; background: none; cursor: pointer }
.dw-list li.bad .main-t span { color: var(--color-danger-fg) }
.note { font-size: 13px; color: var(--color-fg-muted); line-height: 1.5; padding: 8px 10px; background: var(--color-bg-subtle); border-radius: var(--radius-md); margin: 0 }
.hist { display: grid; gap: 8px; font-size: 12.5px; color: var(--color-fg-muted); margin: 0; padding: 0; list-style: none }
.hist li { display: grid; grid-template-columns: 20px 1fr; gap: 8px }
.hist li .t { font-size: 11.5px; color: var(--color-fg-subtle) }
.hist li b { color: var(--color-fg-default); font-weight: 500 }

/* ---------- toast (top of the stage) ---------- */
.toast { position: fixed; z-index: 70; transform: translateX(-50%); background: var(--color-fg-default); color: var(--color-bg-surface); border-radius: var(--radius-md); padding: 8px 10px 8px 14px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-pop); font-size: 13px }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }

/* ---------- tweak panel ---------- */
.tweaks { position: fixed; left: 16px; bottom: 54px; z-index: 30; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 12px; display: grid; gap: 10px; width: 236px; font-size: 12.5px }
.tweaks h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-fg-subtle); display: flex; justify-content: space-between; align-items: center }
.tweaks .row { display: grid; gap: 4px }
.tweaks .seg { display: flex }
.tweaks .seg button { flex: 1; padding: 3px 4px }
.tweaks.min > :not(h3) { display: none }
.tweaks .note-t { font-size: 11.5px; color: var(--color-fg-subtle); margin: 0; line-height: 1.4 }

/* minimal scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--color-border-default) transparent }
*::-webkit-scrollbar { width: 8px; height: 8px }
*::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box }
*::-webkit-scrollbar-thumb:hover { background-color: var(--color-fg-subtle) }
*::-webkit-scrollbar-button { display: none; width: 0; height: 0 }
*::-webkit-scrollbar-corner { background: transparent }

@media (max-width: 1720px) { .app.with-drawer .title .on-model { display: none } }
@media (max-width: 760px) {
  body { overflow: auto }
  .app, .app.with-drawer { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100% }
  .side { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--color-border-default) }
  .main { min-height: 80vh }
  .drawer { position: fixed; inset: 0; z-index: 50 }
  .app:not(.with-drawer) .drawer { display: none }
  .tweaks { display: none }
  .search { min-width: 0; flex: 1 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.avatar[style*="--h"] { background: color-mix(in srgb, var(--h) 16%, var(--color-bg-surface)); color: color-mix(in srgb, var(--h) 78%, var(--color-fg-default)) }

.tl { position: relative; min-width: 100%; --lane-w: 232px; --row: 34px }
.tl-axis { position: sticky; top: 0; z-index: 6; display: flex; background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-default) }
.tl-corner { position: sticky; left: 0; z-index: 2; width: var(--lane-w); flex: none; background: var(--color-bg-surface); border-right: 1px solid var(--color-border-default); padding: 8px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-subtle) }
.tl-corner span { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px }
.tl-scale { position: relative; flex: none }
.tl-r1, .tl-r2 { display: flex; position: relative }
.tl-r1 > div { flex: none; height: 26px; padding: 6px 8px 0; font-size: 12px; font-weight: 600; color: var(--color-fg-default); border-left: 1px solid var(--color-border-default); white-space: nowrap; overflow: hidden }
.tl-r1 > div span { font-weight: 400; color: var(--color-fg-subtle); margin-left: 6px; font: 11px var(--font-mono) }
.tl-r2 > div { flex: none; height: 26px; display: grid; place-items: center; font: 11px var(--font-mono); color: var(--color-fg-subtle); border-left: 1px solid var(--color-border-subtle) }
.tl-r2 > div.mon { border-left-color: var(--color-border-default) }
.tl-r2 > div.we { color: color-mix(in srgb, var(--color-fg-subtle) 70%, transparent) }
.tl-r2 > div b { font-weight: 500; color: var(--color-fg-muted) }
.tl-r2 > div.today b, .tl-r2 > div.today { color: var(--today) }
.tl-r2 > div.today b { background: color-mix(in srgb, var(--today) 14%, transparent); border-radius: 4px; padding: 0 4px; font-weight: 600 }

.lane { display: flex; border-bottom: 1px solid var(--color-border-default); background: var(--color-bg-surface) }
.lane-head { position: sticky; left: 0; z-index: 4; width: var(--lane-w); flex: none; background: var(--color-bg-surface); border-right: 1px solid var(--color-border-default); padding: 10px 10px 10px 14px; display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; align-content: start; box-shadow: inset 3px 0 0 var(--c) }
.lane-head .mark { grid-row: span 2; width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; font-weight: 600; font-size: 11px; color: #fff; background: var(--c) }
.lane-head strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lane-head .cnt { font: 11px var(--font-mono); color: var(--color-fg-muted); background: var(--color-bg-muted); border-radius: 4px; padding: 1px 6px; align-self: center }
.lane-head small { grid-column: 2 / 4; color: var(--color-fg-subtle); font-size: 12px; display: flex; gap: 8px; align-items: center }
.lane-head small i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px }
.lane-track { position: relative; flex: none; background-image: var(--grid) }
.lane.collapsed .lane-track { opacity: .5 }

.bar-t { position: absolute; height: 40px; border-radius: var(--radius-sm); display: grid; align-content: center; gap: 1px; padding: 0 8px 0 10px; font-size: 12.5px; white-space: nowrap; overflow: hidden; cursor: grab; user-select: none;
  background: color-mix(in srgb, var(--c) 16%, var(--color-bg-surface)); color: var(--color-fg-default); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent); transition: box-shadow .12s }
.bar-t strong { font-weight: 600 }
.bar-t .l1 { display: flex; align-items: center; gap: 6px; min-width: 0 }
.bar-t .l1 strong { overflow: hidden; text-overflow: ellipsis }
.bar-t .l2 { display: flex; gap: 6px; min-width: 0; font-size: 11.5px; color: var(--color-fg-muted) }
.bar-t .v { overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.bar-t .d { font: 11px var(--font-mono); flex: none }
.bar-t .d::after { content: " ·"; font-family: var(--font-sans) }
.bar-t.optie { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 7%, var(--color-bg-surface)) 0 5px, color-mix(in srgb, var(--c) 22%, var(--color-bg-surface)) 5px 10px); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent) }
.bar-t.geannuleerd { background: var(--color-bg-subtle); color: var(--color-fg-subtle); box-shadow: inset 3px 0 0 var(--color-border-strong), inset 0 0 0 1px var(--color-border-default) }
.bar-t.geannuleerd strong { text-decoration: line-through }
.bar-t.short .v { display: none }
.bar-t.short .d::after { content: none }
.bar-t.tiny { overflow: visible; padding: 0 }
.bar-t.tiny .l1, .bar-t.tiny .l2 { position: absolute; left: calc(100% + 6px); white-space: nowrap }
.bar-t.tiny .l1 { top: 3px } .bar-t.tiny .l2 { top: 20px }
.bar-t.tiny .edge { display: none }
.bar-t:hover, .bar-t.hover { box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px var(--c), 0 2px 6px rgba(20, 30, 45, .14) }
.bar-t.sel { box-shadow: inset 3px 0 0 var(--c), 0 0 0 2px var(--color-accent-default) }
.bar-t .edge { position: absolute; top: 4px; bottom: 4px; width: 5px; border-radius: 2px; cursor: ew-resize; opacity: 0 }
.bar-t .edge.l { left: 4px } .bar-t .edge.r { right: 2px }
.bar-t:hover .edge, .bar-t.hover .edge { opacity: 1; background: color-mix(in srgb, var(--c) 60%, transparent) }
.bar-t .warn { color: var(--color-danger-fg); display: inline-flex; flex: none }
.bar-t .warn .icon { width: 14px; height: 14px; stroke-width: 1.9 }
.bar-t.moving { cursor: grabbing; box-shadow: inset 3px 0 0 var(--c), 0 0 0 2px var(--color-accent-default), var(--shadow-pop); z-index: 3 }

.today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); z-index: 5; pointer-events: none }
.today-line::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--today) }

.tip { position: fixed; z-index: 65; width: 290px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 12px 14px; display: grid; gap: 8px; pointer-events: none; font-size: 12.5px }
.tip-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-fg-muted) }
.tip-top .pill { margin-left: auto }
.tip h4 { margin: 0; font-size: 15px; font-weight: 600 }
.tip .row { display: flex; align-items: center; gap: 8px; color: var(--color-fg-muted) }
.tip .row .icon { width: 14px; height: 14px; color: var(--color-fg-subtle) }
.tip .row .mono { color: var(--color-fg-default); font-size: 12px }
.tip .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--color-border-subtle); padding-top: 8px }
.tip .facts div { display: grid; gap: 1px; font-size: 11px; color: var(--color-fg-subtle) }
.tip .facts b { font: 600 14px var(--font-mono); color: var(--color-fg-default) }
.tip .bad { color: var(--color-danger-fg); display: flex; gap: 6px; align-items: center }
.tip .bad .icon { width: 14px; height: 14px; color: inherit }
.tip .hint-k { font-size: 11.5px; color: var(--color-fg-subtle); border-top: 1px solid var(--color-border-subtle); padding-top: 6px }

.dw-acts { list-style: none; margin: 0; padding: 0; display: grid }
.dw-acts li { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; padding: 7px 6px; border-radius: var(--radius-sm); align-items: center; font-size: 12.5px }
.dw-acts li:hover { background: var(--color-bg-hover) }
.dw-acts .day { white-space: nowrap; font: 11.5px var(--font-mono); color: var(--color-fg-muted) }
.dw-acts .crew { font-size: 11.5px }
.mini-tl { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 2px 0 6px }
.mini-tl div { height: 26px; border-radius: 3px; background: var(--color-bg-muted); display: grid; place-items: center; font: 10.5px var(--font-mono); color: var(--color-fg-subtle) }
.mini-tl div.on { background: color-mix(in srgb, var(--c) 22%, var(--color-bg-surface)); color: var(--color-fg-default); box-shadow: inset 0 -2px 0 var(--c) }

</style>

function renderTree() {

  for (const m of MODELS) {
    if (m.section !== section) { section = m.section; html += `<div class="section-label">${section}</div>` }
    const open = shell.open.has(m.key)
    html += `<div class="node ${open ? 'open' : ''}" data-model="${m.key}">
      <div class="model" role="treeitem" aria-expanded="${open}" tabindex="0"><span class="lead"><span class="glyph">${icon(m.glyph)}</span><span class="chev">${icon('chev')}</span></span><span class="name">${esc(m.label)}</span><span class="count">${m.count}</span></div>
      <div class="views" role="group">${m.views.map((v) => {
        const href = v.file ? FILES[v.file] + (v.q ?? '') : '#'
        return `<a class="view ${v.id === shell.active ? 'active' : ''}" href="${href}" ${v.file ? '' : 'title="In dit prototype niet uitgewerkt"'} ${v.id === shell.active ? 'aria-current="page"' : ''}>${icon(SKIN_ICON[v.skin])}<span class="vname">${esc(v.name)}</span>${v.lock ? `<span class="lock" title="Standaardweergave, alleen te kopiëren">${icon('lock')}</span>` : ''}</a>`
      }).join('')}</div></div>`
  }
  $('#tree').innerHTML = html
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('#tree a[href="#"]'); if (a) e.preventDefault()
  const m = e.target.closest('#tree .model'); if (!m) return
  const key = m.parentElement.dataset.model
  shell.open.has(key) ? shell.open.delete(key) : shell.open.add(key); renderTree()
})

// ---------- popovers ----------
let popEl = null
function closePop() { popEl?.remove(); popEl = null; $$('[aria-expanded="true"][data-pop]').forEach((b) => b.setAttribute('aria-expanded', 'false')) }
function openPop(anchor, html, { align = 'left', width } = {}) {
  closePop()
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html
  if (width) popEl.style.width = width + 'px'
  document.body.append(popEl)
  const r = anchor.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight
  let left = align === 'right' ? r.right - w : r.left, top = r.bottom + 6
  left = Math.max(8, Math.min(left, innerWidth - w - 8)); top = Math.min(top, innerHeight - h - 8)
  Object.assign(popEl.style, { left: left + 'px', top: top + 'px' })
  if (anchor.dataset.pop !== undefined) anchor.setAttribute('aria-expanded', 'true')
  return popEl
}
document.addEventListener('mousedown', (e) => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-pop]')) closePop() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (popEl) closePop(); else closeDrawer() } })

    ${PRODUCTIES.map((p) => `<button class="pop-item ${p.id === shell.space ? 'current' : ''}" data-space="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.titel)}<span class="meta">${esc(p.meta.split(' · ')[1] ?? '')}</span></button>`).join('')}`, { width: btn.offsetWidth })
  pop.querySelector('input').focus()
  pop.querySelector('input').addEventListener('input', (ev) => pop.querySelectorAll('[data-space]').forEach((b) => (b.hidden = !b.textContent.toLowerCase().includes(ev.target.value.toLowerCase()))))
  pop.addEventListener('click', (ev) => { const b = ev.target.closest('[data-space]'); if (b) { shell.space = b.dataset.space; closePop(); renderSpace(); shell.onSpace() } })
})
const inSpace = (p) => shell.space === 'all' || p === shell.space
const scopeChip = () => shell.space === 'all' ? '' : `<span class="chip scope" title="Gekozen in de productiekiezer" style="--c:${prod(shell.space).color}"><i></i>Productie is <b>${esc(prod(shell.space).titel)}</b></span>`

// ---------- filters: field · operator · value ----------
const NO_VALUE = ['week', 'next', 'month', 'empty', 'filled']
const OPS = { select: [['in', 'is'], ['nin', 'is niet']], date: [['week', 'is deze week'], ['next', 'is volgende week'], ['month', 'is deze maand']], text: [['has', 'bevat']], flag: [['filled', 'is aan'], ['empty', 'is uit']] }
const filterState = { fields: {}, list: [], onChange: () => {} }
const complete = (f) => NO_VALUE.includes(f.op) || f.values.length > 0
function chipText(f) {
  const field = filterState.fields[f.field], op = OPS[field.type].find(([k]) => k === f.op)[1]
  if (field.type === 'date') return `${icon('cal')}${field.label} <span class="op">${op.replace(/^is /, '')}</span>`
  if (field.type === 'flag') return `${field.label} <span class="op">${op}</span>`
  const shown = f.values.map((v) => esc(field.options?.[v] ?? v))
  return `${field.label} <span class="op">${op}</span> ${shown.length > 2 ? `${shown.slice(0, 2).join(', ')} +${shown.length - 2}` : shown.join(' of ')}`
}
function filterChips() {
  const done = filterState.list.filter(complete)
  return `${done.map((f) => `<span class="chip set" data-fi="${filterState.list.indexOf(f)}">${chipText(f)}<span class="x" data-unfilter title="Filter wissen">${icon('x')}</span></span>`).join('')}
    <button class="chip" id="filter-btn" data-pop aria-expanded="false">${icon('filter')}Filter${done.length ? `<span class="count">${done.length}</span>` : ''}</button>`
}
function passes(row, get) {
  return filterState.list.filter(complete).every((f) => {
    const v = get(row, f.field)
    if (f.op === 'in') return f.values.includes(v)
    if (f.op === 'nin') return !f.values.includes(v)
    if (f.op === 'week') return v >= mondayOf(TODAY) && v <= addDays(mondayOf(TODAY), 6)
    if (f.op === 'next') return v >= addDays(mondayOf(TODAY), 7) && v <= addDays(mondayOf(TODAY), 13)
    if (f.op === 'month') return v?.slice(0, 7) === TODAY.slice(0, 7)
    if (f.op === 'filled') return Boolean(v)
    if (f.op === 'empty') return !v
    return String(v ?? '').toLowerCase().includes((f.values[0] ?? '').toLowerCase())
  })
}
function renderFilterPop(pop) {
  const F = filterState.fields
  pop.innerHTML = `<div class="fb"><div class="fb-head"><span>Toon rijen waar</span><span>${filterState.list.filter(complete).length} actief</span></div>
    ${filterState.list.map((f, i) => {
      const field = F[f.field]
      const value = NO_VALUE.includes(f.op) ? '<span></span>' : field.type === 'text' ? `<input type="text" data-v="${i}" value="${esc(f.values[0] ?? '')}" placeholder="tekst">`
        : `<div class="toks">${Object.entries(field.options).map(([k, l]) => `<button class="tok ${f.values.includes(k) ? '' : 'off'}" data-tok="${i}:${k}">${esc(l)}</button>`).join('')}</div>`
      return `<div class="fb-row"><span class="where">${i ? 'en' : 'waar'}</span>
        <select data-f="${i}">${Object.entries(F).map(([k, x]) => `<option value="${k}" ${k === f.field ? 'selected' : ''}>${x.label}</option>`).join('')}</select>
        <select data-o="${i}">${OPS[field.type].map(([k, l]) => `<option value="${k}" ${k === f.op ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${value}<button class="fb-x" data-rm="${i}" aria-label="Voorwaarde weghalen">${icon('x')}</button></div>`
    }).join('')}<button class="add" data-add>+ Voorwaarde toevoegen</button></div>`
}
document.addEventListener('click', (e) => {
  const x = e.target.closest('[data-unfilter]')
  if (x) { filterState.list.splice(+x.closest('[data-fi]').dataset.fi, 1); return filterState.onChange() }
  const btn = e.target.closest('#filter-btn'); if (!btn) return
  if (popEl) return closePop()
  const pop = openPop(btn, '')
  const refresh = () => { renderFilterPop(pop); filterState.onChange(); $('#filter-btn')?.setAttribute('aria-expanded', 'true') }
  renderFilterPop(pop)
  pop.addEventListener('change', (ev) => {
    const t = ev.target, F = filterState.fields
    if (t.dataset.f) { const f = filterState.list[+t.dataset.f]; f.field = t.value; f.op = OPS[F[f.field].type][0][0]; f.values = [] }
    else if (t.dataset.o) { const f = filterState.list[+t.dataset.o]; f.op = t.value; f.values = [] }
    refresh()
  })
  pop.addEventListener('input', (ev) => { const t = ev.target; if (t.dataset.v) { filterState.list[+t.dataset.v].values = t.value ? [t.value] : []; filterState.onChange() } })
  pop.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return
    if (b.dataset.tok) { const [i, k] = b.dataset.tok.split(':'); const f = filterState.list[+i]; f.values = f.values.includes(k) ? f.values.filter((v) => v !== k) : [...f.values, k]; refresh() }
    else if (b.dataset.rm) { filterState.list.splice(+b.dataset.rm, 1); refresh() }
    else if (b.hasAttribute('data-add')) { const k = Object.keys(filterState.fields).find((k) => filterState.fields[k].type === 'select'); filterState.list.push({ field: k, op: 'in', values: [] }); refresh() }
  })
})

function openDrawer(html) { $('#drawer').innerHTML = html; $('#app').classList.add('with-drawer') }
function closeDrawer() { $('#app').classList.remove('with-drawer'); shell.onClose?.() }
document.addEventListener('click', (e) => { if (e.target.closest('[data-close-drawer]')) closeDrawer() })
function drawer({ kind, kindHtml, pos, hero = '', title, sub = '', alert = '', props = [], secs = [] }) {

      <button class="tool" aria-label="Vorige">${icon('up')}</button><button class="tool" aria-label="Volgende">${icon('down')}</button>

const timeHtml = (a) => (a.start ? `<span class="time">${a.start}<span class="end">–${a.end}</span></span>` : '<span class="muted">zonder tijd</span>')
const venueHtml = (a) => !a.venue ? '<span class="muted">—</span>' : a.inherited ? `<span class="inherited">${esc(a.venue)}</span><span class="via">via tourstop</span>` : esc(a.venue)

function activityDrawer(a, list, hero = '') {

  }).join('') + Array.from({ length: Math.max(0, need - have) }, () => `<li class="open-slot"><span class="avatar open">+</span><span class="main-t">Open plek<span>Speler</span></span><button class="fill">Open plek invullen</button></li>`).join('')

    props: [

      ['tag', 'Soort', `<span class="soort"><i style="background:var(--s-${a.soort})"></i>${SOORT[a.soort]}</span>`],
      ['cal', 'Plandag', `<span class="mono">${dayShort(a.date)} 2026</span>`],

      { title: 'Notities', html: `<p class="note">${a.soort === 'voorstelling' ? 'Zaal open om 19:30. Inlaat via de artiesteningang aan de Vlamingstraat; parkeren op de laadkade tot 18:00.' : 'Nog geen notities. Klik om er een toe te voegen.'}</p>` },
      { title: 'Geschiedenis', html: `<ul class="hist"><li>${avatar('nc', 'sm')}<span><b>Noor</b> zette de status op bevestigd<span class="t"> · gisteren 16:20</span></span></li><li>${avatar('lv', 'sm')}<span><b>Lotte</b> maakte deze activiteit uit sjabloon <b>Speeldag op locatie</b><span class="t"> · 2 okt</span></span></li></ul>` },

// ---------- tweaks: the theme, plus what a skin adds ----------
const root = document.documentElement
const TWEAKS = [{ key: 'theme', label: 'Thema', options: [['auto', 'Auto'], ['light', 'Licht'], ['dark', 'Donker']], value: 'auto', apply: (v) => (v === 'auto' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', v)) }]

// ---------- the timeline ----------
shell.active = 'tijdlijn'
shell.open = new Set(['speelreeks'])
shell.space = 'all'
const ZOOM = { week: { start: '2026-10-05', days: 70, px: 44 }, maand: { start: '2026-09-28', days: 112, px: 16 } }
const LANES = {
  prod: { label: 'Productie', keys: () => PRODUCTIES.filter((p) => p.id !== 'all' && inSpace(p.id)).map((p) => p.id), of: (t) => t.prod, head: (k) => prod(k) },
  status: { label: 'Status', keys: () => Object.keys(STATUS), of: (t) => t.status, head: (k) => ({ titel: STATUS[k], mark: STATUS[k][0], color: { optie: 'var(--color-warning-fg)', bevestigd: 'var(--color-success-fg)', geannuleerd: 'var(--color-danger-fg)' }[k] }) },
}
const tl = { zoom: 'week', lanes: 'prod', sel: 't1', demoTip: 't3' }
filterState.fields = { status: { label: 'Status', type: 'select', options: STATUS }, prod: { label: 'Productie', type: 'select', options: Object.fromEntries(PRODUCTIES.filter((p) => p.id !== 'all').map((p) => [p.id, p.titel])) }, naam: { label: 'Naam', type: 'text' } }
filterState.list = []
filterState.onChange = render
shell.onSpace = render
shell.onClose = () => { tl.sel = null; $$('.bar-t.sel').forEach((b) => b.classList.remove('sel')) }

const nights = (t) => daysBetween(t.start, t.end) + 1
const overlaps = (a, b) => a.prod === b.prod && a.id !== b.id && a.status !== 'geannuleerd' && b.status !== 'geannuleerd' && a.start <= b.end && b.start <= a.end
function statsOf(t) {
  const acts = ACTS.filter((a) => a.stop === t.id)
  if (acts.length) return { acts: acts.length, shows: acts.filter((a) => a.soort === 'voorstelling').length, have: acts.reduce((n, a) => n + a.crew[0], 0), need: acts.reduce((n, a) => n + a.crew[1], 0), bad: acts.filter((a) => a.conflict).length }
  const d = nights(t), shows = t.naam === 'Repetities' ? 0 : d, need = d * 7
  return { acts: d * 6, shows, need, have: t.status === 'optie' ? need - 4 : need, bad: 0 }
}
function visible() {
  const q = $('#q').value.trim().toLowerCase()
  return TOURSTOPS.filter((t) => inSpace(t.prod) && passes(t, (r, f) => r[f]) && (!q || (t.naam + ' ' + t.venue).toLowerCase().includes(q)))
}
function pack(stops) {
  const rows = []
  for (const t of [...stops].sort((a, b) => a.start.localeCompare(b.start))) {
    let i = rows.findIndex((r) => r.every((x) => x.end < t.start))
    if (i < 0) { rows.push([]); i = rows.length - 1 }
    rows[i].push(t); t._row = i
  }
  return Math.max(rows.length, 1)
}

function axis(z) {
  const { start, days, px } = ZOOM[z]
  let r1 = '', r2 = ''
  if (z === 'week') {
    for (let w = 0; w < days / 7; w++) { const s = addDays(start, w * 7); r1 += `<div style="width:${7 * px}px">Week ${weekNo(s)}<span>${span(s, addDays(s, 6))}</span></div>` }
    for (let i = 0; i < days; i++) { const d = addDays(start, i), dw = D(d).getDay(); r2 += `<div class="${dw === 1 ? 'mon' : ''} ${dw === 0 || dw === 6 ? 'we' : ''} ${d === TODAY ? 'today' : ''}" style="width:${px}px">${d === TODAY ? `<b>${D(d).getDate()}</b>` : `${DAYS_NL[dw][0]}<b>${D(d).getDate()}</b>`}</div>` }
  } else {
    let i = 0
    while (i < days) { const d = D(addDays(start, i)), left = Math.min(new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() + 1, days - i); r1 += `<div style="width:${left * px}px">${left < 7 ? '' : `${MONTHS_LONG[d.getMonth()]}<span>${d.getFullYear()}</span>`}</div>`; i += left }
    for (let w = 0; w < days / 7; w++) { const s = addDays(start, w * 7), now = TODAY >= s && TODAY <= addDays(s, 6); r2 += `<div class="mon ${now ? 'today' : ''}" style="width:${7 * px}px">${now ? `<b>W${weekNo(s)}</b>` : `W${weekNo(s)}`}</div>` }
  }
  return `<div class="tl-r1">${r1}</div><div class="tl-r2">${r2}</div>`
}

function bar(t, z, all) {
  const { start, px } = ZOOM[z], c = prod(t.prod).color
  const from = Math.max(0, daysBetween(start, t.start)), to = daysBetween(start, t.end) + 1
  if (to <= 0) return ''
  const w = (to - from) * px - 4, clash = all.some((x) => overlaps(x, t))
  const short = w < 120, tiny = w < 70
  return `<div class="bar-t ${t.status} ${short ? 'short' : ''} ${tiny ? 'tiny' : ''} ${tl.sel === t.id ? 'sel' : ''} ${tl.demoTip === t.id ? 'hover' : ''}" data-id="${t.id}" tabindex="0" style="--c:${c};left:${from * px + 2}px;width:${w}px;top:${9 + t._row * 48}px" aria-label="${esc(t.naam)}, ${span(t.start, t.end)}, ${STATUS[t.status]}">
    <span class="edge l" data-edge="l"></span><span class="l1">${clash ? `<span class="warn" title="Overlapt met een andere tourstop van ${esc(prod(t.prod).titel)}">${icon('alert')}</span>` : ''}<strong>${esc(t.naam)}</strong></span><span class="l2"><span class="d">${span(t.start, t.end)}</span><span class="v">${esc(t.venue)}</span></span><span class="edge r" data-edge="r"></span></div>`
}

function render() {
  const z = tl.zoom, { start, days, px } = ZOOM[z], L = LANES[tl.lanes], stops = visible()
  const width = days * px
  const weekend = `repeating-linear-gradient(90deg, transparent 0 ${5 * px}px, color-mix(in srgb, var(--color-bg-muted) 55%, transparent) ${5 * px}px ${7 * px}px)`
  const grid = z === 'week' ? `repeating-linear-gradient(90deg, var(--color-border-default) 0 1px, transparent 1px ${7 * px}px), repeating-linear-gradient(90deg, var(--color-border-subtle) 0 1px, transparent 1px ${px}px), ${weekend}` : `repeating-linear-gradient(90deg, var(--color-border-subtle) 0 1px, transparent 1px ${7 * px}px)`
  const lanes = L.keys().map((k) => {
    const mine = stops.filter((t) => L.of(t) === k), rows = pack(mine), h = L.head(k)
    const conf = mine.filter((t) => t.status === 'bevestigd').length, opt = mine.filter((t) => t.status === 'optie').length
    return `<div class="lane" style="--c:${h.color}"><div class="lane-head"><span class="mark">${esc(h.mark)}</span><strong>${esc(h.titel)}</strong><span class="cnt">${mine.length}</span>
      <small>${tl.lanes === 'prod' ? `<span><i style="background:var(--color-success-fg)"></i>${conf} bevestigd</span><span><i style="background:var(--color-warning-fg)"></i>${opt} optie</span>` : `${mine.reduce((n, t) => n + nights(t), 0)} dagen`}</small></div>
      <div class="lane-track" style="width:${width}px;height:${rows * 48 + 16}px;--grid:${grid}">${mine.map((t) => bar(t, z, stops)).join('')}</div></div>`
  }).join('')
  const todayX = (daysBetween(start, TODAY) + 0.45) * px
  $('#stage').innerHTML = `<div class="tl" id="tl" style="width:calc(var(--lane-w) + ${width}px)">
    <div class="tl-axis"><div class="tl-corner">${esc(L.label)}<span>${L.keys().length} rijen</span></div><div class="tl-scale" style="width:${width}px">${axis(z)}</div></div>
    <div class="tl-body" style="position:relative">${lanes}<div class="today-line" style="left:calc(var(--lane-w) + ${todayX}px)" title="Vandaag, ${dayShort(TODAY)}"></div></div></div>`
  renderBar(stops)
  const clashes = stops.filter((t) => stops.some((x) => overlaps(x, t))).length / 2
  renderTitle({ glyph: 'timeline', name: 'Tijdlijn tourstops', on: 'Tourstops', sum: `${stops.length} tourstops · ${L.keys().length} ${tl.lanes === 'prod' ? 'producties' : 'rijen'}`, insight: clashes ? `<span class="insight"><b>${clashes}</b> overlap</span>` : '' })
  const t = TOURSTOPS.find((x) => x.id === tl.sel)
  if (t && stops.includes(t)) openDrawer(stopDrawer(t))
  pinLabels()
  if (tl.demoTip) requestAnimationFrame(() => { const b = $(`.bar-t[data-id="${tl.demoTip}"]`); if (b) showTip(b) })
}

function renderBar(stops) {
  $('#bar').innerHTML = `${scopeChip()}${filterChips()}<span class="divider"></span>
    <button class="chip set" id="lane-btn" data-pop aria-expanded="false">${icon('group')}<span class="lbl">Rijen:</span> <b>${LANES[tl.lanes].label}</b>${icon('down', 'down')}</button>
    <span class="grow"></span><span class="rows">${stops.length} tourstops</span>
    <button class="btn sm" id="today-btn">Vandaag</button><span class="seg"><button class="tool" id="prev" aria-label="Vorige periode">${icon('left')}</button><button class="tool" id="next" aria-label="Volgende periode">${icon('right')}</button></span>
    <span class="seg" role="group" aria-label="Zoom">${[['week', 'Week'], ['maand', 'Maand']].map(([k, l]) => `<button data-zoom="${k}" class="${tl.zoom === k ? 'on' : ''}">${l}</button>`).join('')}</span>`
}

// ---------- the hovered bar's details ----------
function showTip(b) {
  hideTip()
  const t = TOURSTOPS.find((x) => x.id === b.dataset.id), s = statsOf(t), p = prod(t.prod), r = b.getBoundingClientRect()
  const clash = TOURSTOPS.find((x) => overlaps(x, t))
  const tip = document.createElement('div'); tip.className = 'tip'; tip.id = 'tip'
  tip.innerHTML = `<div class="tip-top"><span class="prod-tag" style="--c:${p.color}"><i></i>${esc(p.titel)}</span><span class="pill ${t.status}">${STATUS[t.status].toLowerCase()}</span></div>
    <h4>${esc(t.naam)}${t.note ? ` <span class="muted" style="font-weight:400;font-size:13px">· ${esc(t.note)}</span>` : ''}</h4>
    <div class="row">${icon('pin')}${esc(t.venue)}</div>
    <div class="row">${icon('cal')}<span class="mono">${dayShort(t.start)} – ${dayShort(t.end)}</span><span class="muted">· ${nights(t)} ${nights(t) === 1 ? 'dag' : 'dagen'}</span></div>
    <div class="facts"><div><b>${s.acts}</b>activiteiten</div><div><b>${s.shows}</b>voorstellingen</div><div><b>${s.have}/${s.need}</b>bezetting</div></div>
    ${clash ? `<div class="bad">${icon('alert')}Overlapt met ${esc(clash.naam)} op ${dayNum(clash.start > t.start ? clash.start : t.start)}</div>` : ''}
    <div class="hint-k">Klik om te openen · sleep om te verschuiven · sleep een rand om de duur te wijzigen</div>`
  document.body.append(tip)
  const st = $('#stage').getBoundingClientRect(), left = Math.min(Math.max(st.left + 8, r.left), st.right - tip.offsetWidth - 8)
  const below = r.bottom + 8 + tip.offsetHeight < innerHeight
  Object.assign(tip.style, { left: left + 'px', top: (below ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + 'px' })
}
function hideTip() { $('#tip')?.remove() }

function stopDrawer(t) {
  const p = prod(t.prod), s = statsOf(t), acts = ACTS.filter((a) => a.stop === t.id).sort((a, b) => (a.date + (a.start ?? '99')).localeCompare(b.date + (b.start ?? '99')))
  const mon = mondayOf(t.start), week = Array.from({ length: 7 }, (_, i) => addDays(mon, i))
  const actList = acts.length ? `<ul class="dw-acts">${acts.map((a) => `<li><span class="day">${dayShort(a.date).slice(0, 6)} ${a.start ?? '—'}</span><span class="soort"><i style="background:var(--s-${a.soort})"></i>${esc(a.title)}${a.conflict ? ` <span class="alert-badge" title="${esc(a.conflict)}">${icon('alert')}</span>` : ''}</span><span class="crew">${a.crew[0]}/${a.crew[1]}</span></li>`).join('')}</ul>` : '<p class="note">Nog geen activiteiten. Pas een sjabloon toe om de speeldagen te vullen.</p>'
  return drawer({
    kindHtml: `${icon('film')}<span>Tourstop</span>`, pos: `${TOURSTOPS.filter((x) => x.prod === t.prod).indexOf(t) + 1} van ${TOURSTOPS.filter((x) => x.prod === t.prod).length}`,
    title: t.naam, sub: `<span class="prod-tag" style="--c:${p.color}"><i></i>${esc(p.titel)}</span><span>${icon('pin')} ${esc(t.venue)}</span>`,
    alert: s.bad ? alertBox(`${s.bad} conflict in deze tourstop`, 'Bram De Wilde is afwezig op de voorstelling van woensdag.', ['Toon de conflicten'], '') : '',
    props: [
      ['check', 'Status', `<span class="pill ${t.status}">${STATUS[t.status].toLowerCase()}</span>`],
      ['film', 'Productie', `<span class="prod-tag" style="--c:${p.color}"><i></i>${esc(p.titel)}</span>`],
      ['pin', 'Locatie', esc(t.venue)],
      ['cal', 'Start', `<span class="mono">${dayShort(t.start)} 2026</span>`],
      ['cal', 'Einde', `<span class="mono">${dayShort(t.end)} 2026</span>`],
      ['hash', 'Speeldagen', `<span class="mono">${s.shows}</span><span class="muted">van ${nights(t)} dagen</span>`, true],
    ],
    secs: [
      { title: `Week ${weekNo(t.start)}`, html: `<div class="mini-tl" style="--c:${p.color}">${week.map((d) => `<div class="${d >= t.start && d <= t.end ? 'on' : ''}">${DAYS_NL[D(d).getDay()]} ${D(d).getDate()}</div>`).join('')}</div>` },
      { title: 'Activiteiten', n: acts.length || s.acts, right: '+ Sjabloon toepassen', html: actList },
      { title: 'Bezetting', html: `<span class="crew"><span class="meter ${s.have < s.need ? 'short' : ''}" style="width:120px"><b style="width:${(s.have / s.need) * 100}%"></b></span>${s.have}/${s.need} plaatsen gevuld</span>` },
      { title: 'Geschiedenis', html: `<ul class="hist"><li>${avatar('lv', 'sm')}<span><b>Lotte</b> zette de status op bevestigd<span class="t"> · 28 sep</span></span></li><li>${avatar('lv', 'sm')}<span><b>Lotte</b> paste sjabloon <b>Speeldag op locatie</b> toe · 21 activiteiten<span class="t"> · 2 okt</span></span></li></ul>` },
    ],
  })
}

// ---------- toolbar ----------
document.addEventListener('click', (e) => {
  const zb = e.target.closest('[data-zoom]'); if (zb) { tl.zoom = zb.dataset.zoom; tl.demoTip = null; hideTip(); return render() }
  if (e.target.closest('#today-btn')) { const { start, px } = ZOOM[tl.zoom]; $('#stage').scrollTo({ left: Math.max(0, (daysBetween(start, TODAY) - 3) * px), behavior: 'smooth' }); return }
  const pn = e.target.closest('#prev, #next'); if (pn) { const { px } = ZOOM[tl.zoom]; $('#stage').scrollBy({ left: (pn.id === 'next' ? 1 : -1) * 7 * px * (tl.zoom === 'week' ? 1 : 4), behavior: 'smooth' }); return }
  const lb = e.target.closest('#lane-btn'); if (!lb) return
  if (popEl) return closePop()
  const pop = openPop(lb, `<div class="pop-head">Een rij per</div>${Object.entries(LANES).map(([k, l]) => `<button class="pop-item ${k === tl.lanes ? 'current' : ''}" data-lanes="${k}">${icon(k === 'prod' ? 'film' : 'check')}${l.label}</button>`).join('')}`, { width: 220 })
  pop.addEventListener('click', (ev) => { const b = ev.target.closest('[data-lanes]'); if (b) { tl.lanes = b.dataset.lanes; closePop(); render() } })
})
$('#q').addEventListener('input', render)

// ---------- hover, open, move and resize a bar ----------
$('#stage').addEventListener('pointerover', (e) => { const b = e.target.closest('.bar-t'); if (b && !mv) { tl.demoTip = null; $$('.bar-t.hover').forEach((x) => x.classList.remove('hover')); showTip(b) } })
$('#stage').addEventListener('pointerout', (e) => { const b = e.target.closest('.bar-t'); if (b && !b.contains(e.relatedTarget) && !tl.demoTip) hideTip() })
// A bar that starts left of the view keeps its label in sight.
function pinLabels() {
  const x = $('#stage').scrollLeft
  $$('.bar-t:not(.tiny)').forEach((b) => { const left = parseFloat(b.style.left), w = parseFloat(b.style.width); b.style.paddingLeft = Math.min(Math.max(10, x - left + 10), w - 60) + 'px' })
}
$('#stage').addEventListener('scroll', () => { pinLabels(); if (!tl.demoTip) hideTip() })
let mv = null
$('#stage').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.bar-t'); if (!b || e.button !== 0) return
  const t = TOURSTOPS.find((x) => x.id === b.dataset.id)
  mv = { b, t, x: e.clientX, mode: e.target.dataset.edge ?? 'move', left: parseFloat(b.style.left), width: parseFloat(b.style.width), d: 0 }
  b.setPointerCapture(e.pointerId)
})
$('#stage').addEventListener('pointermove', (e) => {
  if (!mv) return
  const { px } = ZOOM[tl.zoom], d = Math.round((e.clientX - mv.x) / px)
  if (d === mv.d && !mv.b.classList.contains('moving')) return
  if (Math.abs(e.clientX - mv.x) < 4 && !mv.b.classList.contains('moving')) return
  mv.d = d; hideTip(); mv.b.classList.add('moving')
  if (mv.mode === 'move') mv.b.style.left = mv.left + d * px + 'px'
  if (mv.mode === 'l') { const dd = Math.min(d, nights(mv.t) - 1); mv.b.style.left = mv.left + dd * px + 'px'; mv.b.style.width = mv.width - dd * px + 'px' }
  if (mv.mode === 'r') mv.b.style.width = Math.max(px - 4, mv.width + d * px) + 'px'
  const s = mv.mode === 'r' ? mv.t.start : addDays(mv.t.start, mv.mode === 'l' ? Math.min(d, nights(mv.t) - 1) : d)
  const en = mv.mode === 'l' ? mv.t.end : addDays(mv.t.end, mv.mode === 'r' ? Math.max(d, 1 - nights(mv.t)) : d)
  $('.d', mv.b).textContent = span(s, en); mv.next = [s, en]
})
$('#stage').addEventListener('pointerup', () => {
  if (!mv) return
  const { t, b, next } = mv; mv = null
  if (!b.classList.contains('moving')) { tl.sel = t.id; tl.demoTip = null; hideTip(); $$('.bar-t.sel, .bar-t.hover').forEach((x) => x.classList.remove('sel', 'hover')); b.classList.add('sel'); return openDrawer(stopDrawer(t)) }
  const was = [t.start, t.end];[t.start, t.end] = next; render()
  toast(`<b>${esc(t.naam)}</b> loopt nu ${span(t.start, t.end)}`, () => { [t.start, t.end] = was; render() })
})
document.addEventListener('keydown', (e) => { const b = e.target.closest?.('.bar-t'); if (b && e.key === 'Enter') { tl.sel = b.dataset.id; render() } })

$('#foot').innerHTML = '<span>Sleep een balk om te verschuiven</span><span>Sleep een rand om de duur te wijzigen</span><span>↵ openen</span><span>⌘Z ongedaan maken</span>'
boot('De tijdlijn opent met de details van Gent alsof je erover beweegt.')
render()
$('#stage').scrollLeft = (daysBetween(ZOOM.week.start, TODAY) - 2) * ZOOM.week.px
if (tl.demoTip) requestAnimationFrame(() => showTip($(`.bar-t[data-id="${tl.demoTip}"]`)))

</script>
</body>
</html>
