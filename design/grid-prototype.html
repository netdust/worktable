<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Activiteiten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the app shell; the approved grid, unchanged: Activiteiten grouped by plandag, with Dagkolommen as the alternative layout; the record drawer open on the right. */
/* Token names follow apps/grid/src/ui/theme.css and design/grid-prototype.html, the approved design language. Invented data only. */
:root {
  --font-sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --color-bg-canvas: #eef0f3;
  --color-bg-surface: #ffffff;
  --color-bg-subtle: #f6f7f9;
  --color-bg-muted: #eceff3;
  --color-bg-sidebar: #f7f8fa;
  --color-bg-hover: #eef2f7;
  --color-bg-selected: #e6eef8;
  --color-fg-default: #1b2128;
  --color-fg-muted: #4f5964;
  --color-fg-subtle: #8a939d;
  --color-fg-on-accent: #ffffff;
  --color-border-subtle: #e7eaee;
  --color-border-default: #d9dee4;
  --color-border-strong: #c4cbd3;
  --color-accent-default: #2563ab;
  --color-accent-hover: #1d4f8c;
  --color-accent-subtle: #e6eef8;
  --color-success-fg: #1e7a45;
  --color-success-bg: #e2f2e8;
  --color-warning-fg: #8f6100;
  --color-warning-bg: #fbefd2;
  --color-danger-fg: #b0302f;
  --color-danger-bg: #f8e1e1;
  --color-band: #f1f3f6;
  --color-bg-card: #ffffff;
  --color-bg-column: #f3f4f7;
  --shadow-pop: 0 8px 28px rgba(20, 30, 45, .16), 0 1px 3px rgba(20, 30, 45, .1);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --row-h: 40px;
  /* soort, one hue each */
  --s-voorstelling: #c2416b;
  --s-repetitie: #6d4fc2;
  --s-opbouw: #b7791f;
  --s-afbouw: #a0612a;
  --s-reis: #2b7bb9;
  --s-overnachting: #5b6675;
  --s-maaltijd: #2f8a57;
  --s-vergadering: #138a8a;
  --s-andere: #7a838d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg-canvas: #0e0f11; --color-bg-surface: #16171a; --color-bg-subtle: #1b1c20; --color-bg-muted: #24262b;
    --color-bg-sidebar: #0b0c0e; --color-bg-hover: #222429; --color-bg-selected: #1f2b3d; --color-bg-card: #202126; --color-bg-column: #16171a;
    --color-fg-default: #ececf0; --color-fg-muted: #a4a7b0; --color-fg-subtle: #6c707a; --color-fg-on-accent: #ffffff;
    --color-border-subtle: #24262b; --color-border-default: #2c2e34; --color-border-strong: #3a3d44;
    --color-accent-default: #5b9be0; --color-accent-hover: #7db0e8; --color-accent-subtle: #1c2b3d;
    --color-success-fg: #6cc893; --color-success-bg: #173324; --color-warning-fg: #e2b54f; --color-warning-bg: #352a12;
    --color-danger-fg: #ee8a89; --color-danger-bg: #3a1c1c; --color-band: #1a1b1f;
    --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-bg-canvas: #0e0f11; --color-bg-surface: #16171a; --color-bg-subtle: #1b1c20; --color-bg-muted: #24262b;
  --color-bg-sidebar: #0b0c0e; --color-bg-hover: #222429; --color-bg-selected: #1f2b3d; --color-bg-card: #202126; --color-bg-column: #16171a;
  --color-fg-default: #ececf0; --color-fg-muted: #a4a7b0; --color-fg-subtle: #6c707a; --color-fg-on-accent: #ffffff;
  --color-border-subtle: #24262b; --color-border-default: #2c2e34; --color-border-strong: #3a3d44;
  --color-accent-default: #5b9be0; --color-accent-hover: #7db0e8; --color-accent-subtle: #1c2b3d;
  --color-success-fg: #6cc893; --color-success-bg: #173324; --color-warning-fg: #e2b54f; --color-warning-bg: #352a12;
  --color-danger-fg: #ee8a89; --color-danger-bg: #3a1c1c; --color-band: #1a1b1f;
  --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

:root { --drawer-w: 392px; --today: #d9480f }
:root[data-theme="dark"] { --today: #ff8a4c }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --today: #ff8a4c } }

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--color-bg-canvas); color: var(--color-fg-default); font: 13.5px/1.4 var(--font-sans); overflow: hidden }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--color-accent-default); outline-offset: 1px }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr) 0; height: 100%; transition: grid-template-columns .18s ease }
.app.with-drawer { grid-template-columns: 268px minmax(0, 1fr) var(--drawer-w) }

/* ---------- sidebar ---------- */
.side { background: var(--color-bg-sidebar); border-right: 1px solid var(--color-border-default); display: flex; flex-direction: column; min-height: 0 }
.brand { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; font-size: 12px; color: var(--color-fg-subtle); letter-spacing: .04em; text-transform: uppercase }
.brand b { color: var(--color-fg-default); letter-spacing: 0; text-transform: none; font-size: 13px }
.space { margin: 6px 10px 10px; position: relative }
.space-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); cursor: pointer; text-align: left }
.space-btn:hover { border-color: var(--color-border-strong) }
.space-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--color-fg-on-accent); background: var(--space-color, var(--color-accent-default)); flex: none }
.space-text { display: flex; flex-direction: column; min-width: 0; flex: 1 }
.space-text strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.space-text small { color: var(--color-fg-subtle); font-size: 11.5px }
.tree { overflow: auto; flex: 1; padding: 2px 8px 16px }
.section-label { padding: 14px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-subtle) }
.node { position: relative }
.model { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 2px; border-radius: var(--radius-sm); cursor: pointer; user-select: none }
.model:hover { background: var(--color-bg-hover) }
.lead { width: 20px; height: 20px; display: grid; place-items: center; position: relative; flex: none }
.lead > * { position: absolute; display: grid; place-items: center }
.model .glyph { color: var(--color-fg-muted) }
.chev { color: var(--color-fg-muted); opacity: 0; transition: transform .12s }
.node.open > .model .chev { transform: rotate(90deg) }
.model:hover .chev { opacity: 1 }
.model:hover .glyph { opacity: 0 }
.model .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500 }
.model .count { font: 11px var(--font-mono); color: var(--color-fg-subtle) }
.views { display: none; padding: 1px 0 4px 26px; position: relative }
.views::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 6px; border-left: 1px solid var(--color-border-default) }
.node.open > .views { display: block }
.view { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-fg-muted); text-decoration: none }
.view:hover { background: var(--color-bg-hover); color: var(--color-fg-default) }
.view.active { background: var(--color-bg-selected); color: var(--color-accent-default); font-weight: 500 }
.view .vname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.view .lock { color: var(--color-fg-subtle); display: inline-flex }
.view.dash { padding-left: 4px; color: var(--color-fg-default) }
.side-foot { border-top: 1px solid var(--color-border-default); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-fg-muted) }

/* ---------- people ---------- */
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent-subtle); color: var(--color-accent-default); display: inline-grid; place-items: center; font-weight: 600; font-size: 10.5px; flex: none; letter-spacing: .01em }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; letter-spacing: 0 }
.avatar.open { background: transparent; border: 1px dashed var(--color-border-strong); color: var(--color-fg-subtle) }
.stack { display: inline-flex }
.stack .avatar { box-shadow: 0 0 0 2px var(--color-bg-card) }
.stack .avatar + .avatar { margin-left: -2px }
.stack .more { font-size: 11px; color: var(--color-fg-subtle); margin-left: 6px; align-self: center }
.who { display: inline-flex; align-items: center; gap: 6px }

/* ---------- popovers ---------- */
.pop { position: fixed; z-index: 60; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 4px; min-width: 200px }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--color-fg-default) }
.pop-item:hover:not([disabled]) { background: var(--color-bg-hover) }
.pop-item[disabled] { color: var(--color-fg-subtle); cursor: default }
.pop-item .meta { margin-left: auto; color: var(--color-fg-subtle); font-size: 11.5px }
.pop-item.current { font-weight: 600 }
.pop-item.current::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-default) }
.pop-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none }
.pop-sep { height: 1px; background: var(--color-border-subtle); margin: 4px 2px }
.pop-head { padding: 6px 10px 4px; font-size: 11px; color: var(--color-fg-subtle); text-transform: uppercase; letter-spacing: .06em; font-weight: 600 }
.pop-search { width: 100%; padding: 7px 10px; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); background: var(--color-bg-subtle); margin-bottom: 4px; font: inherit; color: inherit }
.pop-check { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer }
.pop-check:hover { background: var(--color-bg-hover) }
.pop-check input { accent-color: var(--color-accent-default); margin: 0 }
.pop-check .meta { margin-left: auto; color: var(--color-fg-subtle); font-size: 11.5px }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border-default); background: var(--color-bg-surface); cursor: pointer; white-space: nowrap; color: var(--color-fg-default) }
.btn:hover { border-color: var(--color-border-strong); background: var(--color-bg-subtle) }
.btn.primary { background: var(--color-accent-default); border-color: var(--color-accent-default); color: var(--color-fg-on-accent) }
.btn.primary:hover { background: var(--color-accent-hover) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--color-fg-muted) }
.btn.ghost:hover { background: var(--color-bg-hover); color: var(--color-fg-default) }
.btn.sm { padding: 3px 9px; font-size: 12.5px }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); color: var(--color-fg-muted); cursor: pointer; flex: none }
.iconbtn:hover { border-color: var(--color-border-strong); color: var(--color-fg-default) }
.iconbtn.on { color: var(--color-accent-default); border-color: var(--color-accent-default) }
.tool { width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-fg-muted); flex: none }
.tool:hover { background: var(--color-bg-muted); color: var(--color-fg-default) }
.seg { display: inline-flex; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 2px; gap: 2px; background: var(--color-bg-surface) }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-size: 12.5px; border-radius: var(--radius-sm); color: var(--color-fg-muted) }
.seg button:hover { color: var(--color-fg-default) }
.seg button.on { background: var(--color-bg-muted); color: var(--color-fg-default); font-weight: 600 }
kbd { font: 10.5px var(--font-mono); border: 1px solid var(--color-border-default); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--color-fg-subtle) }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.top { background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-default); padding: 10px 18px; display: flex; align-items: center; gap: 10px; min-height: 55px }
.top .spacer { display: none }
.title .sum, .insight { flex: none }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; overflow: hidden }
.title .tglyph { width: 30px; height: 30px; border-radius: var(--radius-md); background: var(--color-bg-muted); display: grid; place-items: center; color: var(--color-fg-default); flex: none }
.title h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap }
.title .sum { font-size: 12px; color: var(--color-fg-muted); background: var(--color-bg-muted); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; white-space: nowrap }
.lockmark { color: var(--color-fg-subtle); display: inline-flex }
.insight { font-size: 12px; color: var(--color-fg-muted); white-space: nowrap }
.insight b { color: var(--color-danger-fg); font-weight: 600 }
.insight.warn b { color: var(--color-warning-fg) }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 5px 8px; color: var(--color-fg-subtle); flex: 0 1 200px; min-width: 120px; background: var(--color-bg-surface) }
.search:focus-within { border-color: var(--color-accent-default) }
.search input { border: 0; background: transparent; outline: 0; font: inherit; color: var(--color-fg-default); width: 100% }

.bar { padding: 8px 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--color-border-default); background: var(--color-bg-surface) }
.bar .grow { flex: 1 }
.bar .rows { color: var(--color-fg-subtle); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
.bar .iconbtn { width: 28px; height: 28px }
.bar .tools { margin-left: auto; display: flex; align-items: center; gap: 10px }
.bar .divider { width: 1px; height: 18px; background: var(--color-border-default); margin: 0 2px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--color-border-default); color: var(--color-fg-muted); font-size: 12.5px; background: var(--color-bg-surface); cursor: pointer; white-space: nowrap }
.chip:hover { border-color: var(--color-border-strong); color: var(--color-fg-default) }
.chip.set { border-color: transparent; background: var(--color-accent-subtle); color: var(--color-accent-default) }
.chip .op { opacity: .75 }
.chip b { font-weight: 600 }
.chip .x { display: inline-grid; place-items: center; width: 16px; height: 16px; margin: 0 -4px 0 0; border-radius: 50%; opacity: .7 }
.chip .x:hover { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent) }
.chip .x .icon, .chip > .icon.down { width: 12px; height: 12px }
.chip .count { font: 600 11px var(--font-mono); background: var(--color-accent-default); color: var(--color-fg-on-accent); border-radius: 999px; padding: 0 5px; margin-left: 2px }
.chip .lbl { color: var(--color-fg-subtle) }
.chip.set .lbl { color: inherit; opacity: .75 }

.stage { flex: 1; min-height: 0; overflow: auto; position: relative }
.foot { background: var(--color-bg-subtle); border-top: 1px solid var(--color-border-default); padding: 6px 18px; font-size: 12px; color: var(--color-fg-subtle); display: flex; gap: 16px; white-space: nowrap; overflow: hidden }
.foot .r { margin-left: auto }

/* ---------- facts ---------- */
.time { font: 12.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-default) }
.time .end { color: var(--color-fg-subtle) }
.soort { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px }
.soort i { width: 8px; height: 8px; border-radius: 2px; flex: none }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.optie { color: var(--color-warning-fg); background: var(--color-warning-bg) }
.pill.bevestigd { color: var(--color-success-fg); background: var(--color-success-bg) }
.pill.geannuleerd { color: var(--color-danger-fg); background: var(--color-danger-bg) }
.pill.neutral { color: var(--color-fg-muted); background: var(--color-bg-muted) }
.alert-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--color-danger-fg); background: var(--color-danger-bg); white-space: nowrap }
.alert-badge .icon { width: 13px; height: 13px; stroke-width: 1.9 }
.inherited { color: var(--color-fg-subtle); font-style: italic }
.via { font-style: normal; font-size: 10.5px; border: 1px solid var(--color-border-default); border-radius: 3px; padding: 0 4px; color: var(--color-fg-subtle); margin-left: 4px }
.meter { width: 42px; height: 5px; border-radius: 3px; background: var(--color-bg-muted); overflow: hidden; display: inline-block }
.meter b { display: block; height: 100%; background: var(--color-success-fg) }
.meter.short b { background: var(--color-warning-fg) }
.crew { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-muted) }
.prod-tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.prod-tag i { width: 6px; height: 14px; border-radius: 2px; background: var(--c) }
.muted { color: var(--color-fg-subtle) }

/* ---------- filter builder ---------- */
.fb { width: 560px; padding: 10px }
.fb-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--color-fg-subtle); margin: 0 2px 8px }
.fb-row { display: grid; grid-template-columns: 40px 128px 128px 1fr 26px; gap: 6px; align-items: start; margin-bottom: 6px }
.fb-row .where { font-size: 12px; color: var(--color-fg-subtle); padding-top: 7px; text-align: right }
.fb select, .fb input[type=text] { height: 30px; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); background: var(--color-bg-surface); color: var(--color-fg-default); font: inherit; padding: 0 6px; width: 100% }
.fb .add { margin-top: 4px; border: 0; background: none; color: var(--color-accent-default); cursor: pointer; padding: 4px 2px; font: inherit }
.fb .toks { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); padding: 3px 4px }
.fb .tok { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--color-accent-subtle); color: var(--color-accent-default); font-size: 12px; font-weight: 500; border: 0; cursor: pointer }
.fb .tok.off { background: transparent; color: var(--color-fg-muted); border: 1px dashed var(--color-border-default) }
.fb-x { width: 26px; height: 30px; border: 0; background: none; color: var(--color-fg-subtle); cursor: pointer; display: grid; place-items: center }
.fb-x:hover { color: var(--color-danger-fg) }

/* ---------- record drawer: a side panel, part of the layout ---------- */
.drawer { background: var(--color-bg-surface); border-left: 1px solid var(--color-border-default); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden }
.app:not(.with-drawer) .drawer { visibility: hidden }
.dw-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--color-border-subtle); font-size: 12px; color: var(--color-fg-subtle) }
.dw-head .kind { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0 }
.dw-head .pos { font: 11px var(--font-mono) }
.dw-body { overflow: auto; flex: 1; padding: 16px 16px 24px }
.dw-title { font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; margin: 0 0 4px; outline: 0; border-radius: var(--radius-sm) }
.dw-title:hover { background: var(--color-bg-hover); box-shadow: 0 0 0 4px var(--color-bg-hover) }

.dw-alert { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 10px 16px; margin-left: -16px !important; margin-right: -16px !important; background: var(--color-danger-bg); color: var(--color-danger-fg); font-size: 12.5px; margin-bottom: 14px }
.dw-alert b { font-weight: 600; display: block; margin-bottom: 2px }

.dw-alert.warn { background: var(--color-warning-bg); color: var(--color-warning-fg) }
.props { display: grid; grid-template-columns: 112px 1fr; margin: 0 0 18px }
.props dt { color: var(--color-fg-subtle); font-size: 12.5px; padding: 7px 0; display: flex; align-items: center; gap: 7px }
.props dt .icon { width: 14px; height: 14px }
.props dd { margin: 0; padding: 4px 6px; min-height: 32px; display: flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); cursor: text; flex-wrap: wrap }
.props dd:hover { background: var(--color-bg-hover) }
.props dd.ro { cursor: default }
.props dd.ro:hover { background: none }
.dw-sec { border-top: 1px solid var(--color-border-subtle); padding-top: 12px; margin-top: 4px; margin-bottom: 16px }
.dw-sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-subtle); display: flex; align-items: center; gap: 8px }
.dw-sec h3 .n { font: 11px var(--font-mono); letter-spacing: 0; color: var(--color-fg-muted); background: var(--color-bg-muted); border-radius: 4px; padding: 0 5px }
.dw-sec h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; color: var(--color-accent-default); cursor: pointer }
.dw-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.dw-list li { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: var(--radius-sm); min-height: 36px }
.dw-list li:hover { background: var(--color-bg-hover) }
.dw-list .main-t { flex: 1; min-width: 0; display: grid }
.dw-list .main-t span { font-size: 12px; color: var(--color-fg-subtle) }
.dw-list li.open-slot { color: var(--color-fg-muted) }
.dw-list li.open-slot .fill { margin-left: auto; color: var(--color-accent-default); font-size: 12.5px; font-weight: 500; border: 0; background: none; cursor: pointer }
.dw-list li.bad .main-t span { color: var(--color-danger-fg) }
.note { font-size: 13px; color: var(--color-fg-muted); line-height: 1.5; padding: 8px 10px; background: var(--color-bg-subtle); border-radius: var(--radius-md); margin: 0 }
.hist { display: grid; gap: 8px; font-size: 12.5px; color: var(--color-fg-muted); margin: 0; padding: 0; list-style: none }
.hist li { display: grid; grid-template-columns: 20px 1fr; gap: 8px }
.hist li .t { font-size: 11.5px; color: var(--color-fg-subtle) }
.hist li b { color: var(--color-fg-default); font-weight: 500 }

/* ---------- toast (top of the stage) ---------- */
.toast { position: fixed; z-index: 70; transform: translateX(-50%); background: var(--color-fg-default); color: var(--color-bg-surface); border-radius: var(--radius-md); padding: 8px 10px 8px 14px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-pop); font-size: 13px }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }

/* ---------- tweak panel ---------- */
.tweaks { margin: 0 10px 10px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 10px; font-size: 12.5px; max-height: 60vh; overflow: auto; flex: none }
.tweaks.min { padding: 6px 8px 6px 12px }
.tweaks.min #tw-min { transform: rotate(180deg) }
.tweaks h3 { margin: 0; cursor: default; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-fg-subtle); display: flex; justify-content: space-between; align-items: center }
.tweaks .row { display: grid; gap: 4px }
.tweaks .seg { display: flex }
.tweaks .seg button { flex: 1; padding: 3px 4px }
.tweaks.min > :not(h3) { display: none }
.tweaks .note-t { font-size: 11.5px; color: var(--color-fg-subtle); margin: 0; line-height: 1.4 }

/* minimal scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--color-border-default) transparent }

@media (max-width: 760px) {

  .main { min-height: 80vh }
  .drawer { position: fixed; inset: 0; z-index: 50 }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

.group-fact { color: var(--color-fg-muted); font-size: 12px }

.group-date { color: var(--color-fg-muted); font-variant-numeric: tabular-nums }

:root[data-groups="line"] .grid tr.group td { background: var(--color-bg-surface); border-top: 0; height: 44px; vertical-align: bottom; padding-bottom: 6px }

.time { font: 12.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-fg-default) }
.time .end { color: var(--color-fg-subtle) }
.allday { font-size: 11.5px; color: var(--color-fg-subtle); border: 1px dashed var(--color-border-strong); border-radius: 999px; padding: 1px 8px }
.title-cell { font-weight: 500; color: var(--color-fg-default) }
.grid td { color: var(--color-fg-muted) }
.soort { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px }
.soort i { width: 8px; height: 8px; border-radius: 2px }

.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.optie { color: var(--color-warning-fg); background: var(--color-warning-bg) }

.inherited { color: var(--color-fg-subtle); font-style: italic }

.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); color: var(--color-fg-muted); cursor: pointer }

  let html = `<div class="section-label">Dashboards</div><a class="view dash" href="#" title="In dit prototype niet uitgewerkt">${icon('dash')}<span class="vname">Overzicht</span></a>`
  let section = ''
  for (const m of MODELS) {
    if (m.section !== section) { section = m.section; html += `<div class="section-label">${section}</div>` }
    const open = shell.open.has(m.key)
    html += `<div class="node ${open ? 'open' : ''}" data-model="${m.key}">
      <div class="model" role="treeitem" aria-expanded="${open}" tabindex="0"><span class="lead"><span class="glyph">${icon(m.glyph)}</span><span class="chev">${icon('chev')}</span></span><span class="name">${esc(m.label)}</span><span class="count">${m.count}</span></div>
      <div class="views" role="group">${m.views.map((v) => {
        const href = v.file ? FILES[v.file] + (v.q ?? '') : '#'
        return `<a class="view ${v.id === shell.active ? 'active' : ''}" href="${href}" ${v.file ? '' : 'title="In dit prototype niet uitgewerkt"'} ${v.id === shell.active ? 'aria-current="page"' : ''}>${icon(SKIN_ICON[v.skin])}<span class="vname">${esc(v.name)}</span>${v.lock ? `<span class="lock" title="Standaardweergave, alleen te kopiëren">${icon('lock')}</span>` : ''}</a>`
      }).join('')}</div></div>`
  }
  $('#tree').innerHTML = html
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('#tree a[href="#"]'); if (a) e.preventDefault()
  const m = e.target.closest('#tree .model'); if (!m) return
  const key = m.parentElement.dataset.model
  shell.open.has(key) ? shell.open.delete(key) : shell.open.add(key); renderTree()
})

// ---------- popovers ----------
let popEl = null
function closePop() { popEl?.remove(); popEl = null; $$('[aria-expanded="true"][data-pop]').forEach((b) => b.setAttribute('aria-expanded', 'false')) }
function openPop(anchor, html, { align = 'left', width } = {}) {
  closePop()
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html
  if (width) popEl.style.width = width + 'px'
  document.body.append(popEl)
  const r = anchor.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight
  let left = align === 'right' ? r.right - w : r.left, top = r.bottom + 6
  left = Math.max(8, Math.min(left, innerWidth - w - 8)); top = Math.min(top, innerHeight - h - 8)
  Object.assign(popEl.style, { left: left + 'px', top: top + 'px' })
  if (anchor.dataset.pop !== undefined) anchor.setAttribute('aria-expanded', 'true')
  return popEl
}
document.addEventListener('mousedown', (e) => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-pop]')) closePop() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (popEl) closePop(); else closeDrawer() } })

// ---------- filters: field · operator · value ----------
const NO_VALUE = ['week', 'next', 'month', 'empty', 'filled']
const OPS = { select: [['in', 'is'], ['nin', 'is niet']], date: [['week', 'is deze week'], ['next', 'is volgende week'], ['month', 'is deze maand']], text: [['has', 'bevat']], flag: [['filled', 'is aan'], ['empty', 'is uit']] }
const filterState = { fields: {}, list: [], onChange: () => {} }
const complete = (f) => NO_VALUE.includes(f.op) || f.values.length > 0
function chipText(f) {
  const field = filterState.fields[f.field], op = OPS[field.type].find(([k]) => k === f.op)[1]
  if (field.type === 'date') return `${icon('cal')}${field.label} <span class="op">${op.replace(/^is /, '')}</span>`
  if (field.type === 'flag') return `${field.label} <span class="op">${op}</span>`
  const shown = f.values.map((v) => esc(field.options?.[v] ?? v))
  return `${field.label} <span class="op">${op}</span> ${shown.length > 2 ? `${shown.slice(0, 2).join(', ')} +${shown.length - 2}` : shown.join(' of ')}`
}
function filterChips() {
  const done = filterState.list.filter(complete)
  return `${done.map((f) => `<span class="chip set" data-fi="${filterState.list.indexOf(f)}">${chipText(f)}<span class="x" data-unfilter title="Filter wissen">${icon('x')}</span></span>`).join('')}
    <button class="chip" id="filter-btn" data-pop aria-expanded="false">${icon('filter')}Filter${done.length ? `<span class="count">${done.length}</span>` : ''}</button>`
}
function passes(row, get) {
  return filterState.list.filter(complete).every((f) => {
    const v = get(row, f.field)
    if (f.op === 'in') return f.values.includes(v)
    if (f.op === 'nin') return !f.values.includes(v)
    if (f.op === 'week') return v >= mondayOf(TODAY) && v <= addDays(mondayOf(TODAY), 6)
    if (f.op === 'next') return v >= addDays(mondayOf(TODAY), 7) && v <= addDays(mondayOf(TODAY), 13)
    if (f.op === 'month') return v?.slice(0, 7) === TODAY.slice(0, 7)
    if (f.op === 'filled') return Boolean(v)
    if (f.op === 'empty') return !v
    return String(v ?? '').toLowerCase().includes((f.values[0] ?? '').toLowerCase())
  })
}
function renderFilterPop(pop) {
  const F = filterState.fields
  pop.innerHTML = `<div class="fb"><div class="fb-head"><span>Toon rijen waar</span><span>${filterState.list.filter(complete).length} actief</span></div>
    ${filterState.list.map((f, i) => {
      const field = F[f.field]
      const value = NO_VALUE.includes(f.op) ? '<span></span>' : field.type === 'text' ? `<input type="text" data-v="${i}" value="${esc(f.values[0] ?? '')}" placeholder="tekst">`
        : `<div class="toks">${Object.entries(field.options).map(([k, l]) => `<button class="tok ${f.values.includes(k) ? '' : 'off'}" data-tok="${i}:${k}">${esc(l)}</button>`).join('')}</div>`
      return `<div class="fb-row"><span class="where">${i ? 'en' : 'waar'}</span>
        <select data-f="${i}">${Object.entries(F).map(([k, x]) => `<option value="${k}" ${k === f.field ? 'selected' : ''}>${x.label}</option>`).join('')}</select>
        <select data-o="${i}">${OPS[field.type].map(([k, l]) => `<option value="${k}" ${k === f.op ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${value}<button class="fb-x" data-rm="${i}" aria-label="Voorwaarde weghalen">${icon('x')}</button></div>`
    }).join('')}<button class="add" data-add>+ Voorwaarde toevoegen</button></div>`
}
document.addEventListener('click', (e) => {
  const x = e.target.closest('[data-unfilter]')
  if (x) { filterState.list.splice(+x.closest('[data-fi]').dataset.fi, 1); return filterState.onChange() }
  const btn = e.target.closest('#filter-btn'); if (!btn || !Object.keys(filterState.fields).length) return
  if (popEl) return closePop()
  const pop = openPop(btn, '')
  const refresh = () => { renderFilterPop(pop); filterState.onChange(); $('#filter-btn')?.setAttribute('aria-expanded', 'true') }
  renderFilterPop(pop)
  pop.addEventListener('change', (ev) => {
    const t = ev.target, F = filterState.fields
    if (t.dataset.f) { const f = filterState.list[+t.dataset.f]; f.field = t.value; f.op = OPS[F[f.field].type][0][0]; f.values = [] }
    else if (t.dataset.o) { const f = filterState.list[+t.dataset.o]; f.op = t.value; f.values = [] }
    refresh()
  })
  pop.addEventListener('input', (ev) => { const t = ev.target; if (t.dataset.v) { filterState.list[+t.dataset.v].values = t.value ? [t.value] : []; filterState.onChange() } })
  pop.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return
    if (b.dataset.tok) { const [i, k] = b.dataset.tok.split(':'); const f = filterState.list[+i]; f.values = f.values.includes(k) ? f.values.filter((v) => v !== k) : [...f.values, k]; refresh() }
    else if (b.dataset.rm) { filterState.list.splice(+b.dataset.rm, 1); refresh() }
    else if (b.hasAttribute('data-add')) { const k = Object.keys(filterState.fields).find((k) => filterState.fields[k].type === 'select'); filterState.list.push({ field: k, op: 'in', values: [] }); refresh() }
  })
})

const root = document.documentElement
const TWEAKS = [{ key: 'theme', label: 'Thema', options: [['auto', 'Auto'], ['light', 'Licht'], ['dark', 'Donker']], value: 'auto', apply: (v) => (v === 'auto' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', v)) }]
function renderTweaks(note = '') {
  $('#tweaks').innerHTML = `<h3>Bijstellen <button class="tool" id="tw-min" aria-label="In- of uitklappen">${icon('up')}</button></h3>
    ${TWEAKS.map((t) => `<div class="row">${t.label}<div class="seg" data-key="${t.key}">${t.options.map(([v, l]) => `<button data-v="${v}" class="${v === t.value ? 'on' : ''}">${l}</button>`).join('')}</div></div>`).join('')}${note ? `<p class="note-t">${note}</p>` : ''}`

function setTweak(key, v, persist = true) {
  const t = TWEAKS.find((x) => x.key === key); if (!t) return
  t.value = v; t.apply(v); if (persist) store.set(key, v)
  $$(`.seg[data-key="${key}"] button`).forEach((b) => b.classList.toggle('on', b.dataset.v === v))
}

})

  renderTweaks(note)

function chipText(f) {
  const field = FIELDS[f.field], op = OPS[field.type].find(([k]) => k === f.op)[1]
  if (field.type === 'date') return `${icon('cal')}${field.label} <span class="op">${f.op === 'between' ? 'tussen' : op.replace(/^is /, '')}</span>${f.op === 'between' ? ` ${f.values.join(' – ')}` : ''}`
  const shown = f.values.map((v) => esc(field.options?.[v] ?? v))
  const list = shown.length > 2 ? `${shown.slice(0, 2).join(', ')} +${shown.length - 2}` : shown.join(' of ')
  return `${field.label} <span class="op">${op}</span> ${list}`
}
function matches(r) {
  return state.filters.filter(complete).every((f) => {
    if (FIELDS[f.field].type === 'date') return true
    const value = r[f.field]
    if (f.op === 'in') return f.values.includes(value)
    if (f.op === 'nin') return !f.values.includes(value)
    if (f.op === 'empty') return !value
    if (f.op === 'filled') return Boolean(value)
    const text = String(value ?? '').toLowerCase(), want = (f.values[0] ?? '').toLowerCase()
    return f.op === 'has' ? text.includes(want) : f.op === 'hasnt' ? !text.includes(want) : text === want
  })
}
const SORTKEY = { start: (r) => order(r), title: (r) => r.title, soort: (r) => r.soort, prod: (r) => r.prod, venue: (r) => r.venue ?? '', status: (r) => r.status, crew: (r) => String(r.crew[0]).padStart(3, '0') }
const bySort = (a, b) => {
  const days = DAYS.findIndex((x) => x[0] === a.day) - DAYS.findIndex((x) => x[0] === b.day)
  if (days) return days
  const k = SORTKEY[state.sort.col], c = String(k(a)).localeCompare(String(k(b)))
  return state.sort.dir === 'asc' ? c : -c
}
let vq = {}
function valueControl(f, i) {
  const field = FIELDS[f.field]
  if (NO_VALUE.includes(f.op)) return '<span></span>'
  if (field.type === 'date') return `<div class="between"><input type="date" data-v="${i}:0" value="${f.values[0] ?? ''}"><input type="date" data-v="${i}:1" value="${f.values[1] ?? ''}"></div>`
  if (field.type === 'text') return `<input type="text" data-v="${i}:0" placeholder="tekst" value="${esc(f.values[0] ?? '')}">`
  const q = (vq[i] ?? '').toLowerCase()
  const free = Object.entries(field.options).filter(([k, label]) => !f.values.includes(k) && label.toLowerCase().includes(q))
  return `<div class="vbox"><div class="vbox-in">${f.values.map((v) => `<span class="vtok">${esc(field.options[v] ?? v)}<button data-unval="${i}:${esc(v)}" aria-label="${esc(field.options[v] ?? v)} weghalen">${icon('x')}</button></span>`).join('')}<input data-q="${i}" placeholder="${f.values.length ? '' : 'Zoek een waarde'}" value="${esc(vq[i] ?? '')}"></div>
    <div class="vlist">${free.slice(0, 6).map(([k, label]) => `<button data-val="${i}:${esc(k)}">${esc(label)}</button>`).join('')}${free.length > 6 ? `<div class="more">nog ${free.length - 6} — typ om te zoeken</div>` : free.length ? '' : '<div class="more">Geen andere waarden</div>'}</div></div>`
}
function renderFilterPop(pop) {
  pop.innerHTML = `<div class="fb"><div class="fb-head"><span>Toon rijen waar</span><span>${state.filters.filter(complete).length} actief</span></div>
    ${state.filters.map((f, i) => `<div class="fb-row"><span class="where">${i ? 'en' : 'waar'}</span>
      <select data-f="${i}">${Object.entries(FIELDS).map(([k, x]) => `<option value="${k}" ${k === f.field ? 'selected' : ''}>${x.label}</option>`).join('')}</select>
      <select data-o="${i}">${OPS[FIELDS[f.field].type].map(([k, label]) => `<option value="${k}" ${k === f.op ? 'selected' : ''}>${label}</option>`).join('')}</select>
      ${valueControl(f, i)}<button class="fb-x" data-rm="${i}" aria-label="Voorwaarde weghalen">${icon('x')}</button></div>`).join('')}
    <button class="add" data-add>+ Voorwaarde toevoegen</button></div>`
}
function filterPop(anchor) {
  const pop = openPop(anchor, '')
  renderFilterPop(pop)
  const refresh = (focus) => {
    renderFilterPop(pop); renderMain()
    const el = focus === undefined ? null : pop.querySelector(`[data-q="${focus}"]`)
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length) }
  }
  pop.addEventListener('change', (e) => {
    const t = e.target
    if (t.dataset.f) { const f = state.filters[+t.dataset.f]; f.field = t.value; f.op = OPS[FIELDS[f.field].type][0][0]; f.values = []; refresh(t.dataset.f) }
    else if (t.dataset.o) { const f = state.filters[+t.dataset.o]; f.op = t.value; f.values = []; refresh(t.dataset.o) }
    else if (t.dataset.v) { const [i, n] = t.dataset.v.split(':').map(Number); state.filters[i].values[n] = t.value; refresh() }
  })
  pop.addEventListener('input', (e) => { const t = e.target; if (t.dataset.q) { vq[t.dataset.q] = t.value; refresh(t.dataset.q) } })
  pop.addEventListener('keydown', (e) => {
    const t = e.target
    if (t.dataset.q && e.key === 'Backspace' && !t.value) { state.filters[+t.dataset.q].values.pop(); refresh(t.dataset.q) }
  })
  pop.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return
    if (b.dataset.val) { const [i, v] = b.dataset.val.split(/:(.*)/); state.filters[+i].values.push(v); vq[i] = ''; refresh(i) }
    else if (b.dataset.unval) { const [i, v] = b.dataset.unval.split(/:(.*)/); const f = state.filters[+i]; f.values = f.values.filter((x) => x !== v); refresh(i) }
    else if (b.dataset.rm) { state.filters.splice(+b.dataset.rm, 1); vq = {}; refresh() }
    else if (b.hasAttribute('data-add')) { state.filters.push({ field: 'soort', op: 'in', values: [] }); refresh(String(state.filters.length - 1)) }
  })
}
$('#bar').addEventListener('click', (e) => {
  const x = e.target.closest('[data-act="unfilter"]')
  if (x) { state.filters.splice(+x.closest('[data-fi]').dataset.fi, 1); vq = {}; return renderMain() }
  const btn = e.target.closest('#filter-btn')
  if (btn) filterPop(btn)
})
$('#grid').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort]'); if (!th) return
  const col = th.dataset.sort
  state.sort = state.sort.col === col ? { col, dir: state.sort.dir === 'asc' ? 'desc' : 'asc' } : { col, dir: 'asc' }
  renderMain()
})

// ---------- main ----------
function renderMain() {
  const m = MODELS.find((x) => x.key === state.view[0]), v = m.views[state.view[1]]
  const p = PRODUCTIES.find((x) => x.id === shell.space)
  const shown = ROWS.filter((r) => shell.space === 'all' || r.prod === shell.space)
  const optie = shown.filter((r) => r.status === 'optie').length
  $('#crumbs').innerHTML = `<span class="tglyph">${icon(v.query ? 'query' : SKINS[v.skin][0])}</span><h1>${esc(v.name)}</h1>${v.lock ? `<span class="lockmark" title="Standaardweergave: maak een kopie om aan te passen">${icon('lock')}</span>` : ''}
    <span class="sum">${shown.length} activiteiten · ${new Set(shown.map((r) => r.day)).size} dagen</span>${optie ? `<span class="insight"><b>${optie}</b> nog in optie</span>` : ''}`
  const scoped = shell.space !== 'all'
  const done = state.filters.filter(complete)
  $('#bar').innerHTML = `${scoped ? `<span class="chip set" title="Gekozen in de productiekiezer">${icon('tag')}Productie is ${esc(p.titel)}</span>` : ''}
    ${done.map((f) => `<span class="chip set" data-fi="${state.filters.indexOf(f)}">${chipText(f)}<span class="x" data-act="unfilter" title="Filter wissen">${icon('x')}</span></span>`).join('')}
    <button class="chip" id="filter-btn">${icon('filter')}Filter${done.length ? `<span class="count">${done.length}</span>` : ''}</button><span class="chip set">${icon('group')}Groep: plandag</span>
    <span class="tools"><span class="rows" id="rows"></span><button class="iconbtn" title="Kolommen" aria-label="Kolommen">${icon('cols')}</button></span>`
  renderGrid(m, v)
}

function renderGrid(m, v) {
  $('#grid').hidden = state.layout === 'columns'; $('#board').hidden = state.layout !== 'columns'
  if (state.layout === 'columns' && m.key === 'activiteit') return renderBoard()
  if (m.key !== 'activiteit') {
    $('#grid').innerHTML = `<tbody><tr><td style="height:220px;text-align:center;color:var(--color-fg-subtle);white-space:normal">Deze weergave is in het prototype niet uitgewerkt. Kies een weergave onder Activiteiten.</td></tr></tbody>`
    $('#rows').textContent = ''; return
  }
  const scoped = shell.space !== 'all'
  const q = $('#q').value.toLowerCase()
  const rows = ROWS.filter((r) => (!scoped || r.prod === shell.space) && (!q || r.title.toLowerCase().includes(q)) && matches(r)).sort(bySort)
  const prodCol = !scoped
  const th = (col, glyph, label) => { const on = state.sort.col === col; return `<th class="sortable ${on ? 'sorted' : ''}" data-sort="${col}" aria-sort="${on ? (state.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${icon(glyph)}${label}${on ? `<span class="arrow">${state.sort.dir === 'asc' ? '↑' : '↓'}</span>` : ''}</th>` }
  const head = `<thead><tr><th class="num">#</th>${th('start', 'clock', 'Tijd')}${th('title', 'text', 'Omschrijving')}${th('soort', 'tag', 'Soort')}${prodCol ? th('prod', 'film', 'Productie') : ''}${th('venue', 'pin', 'Locatie')}${th('status', 'check', 'Status')}${th('crew', 'users', 'Bezetting')}</tr></thead>`
  const span = prodCol ? 8 : 7
  let body = '', day = '', n = 0
  rows.forEach((r, i) => {
    if (r.day !== day) {
      day = r.day
      const inDay = rows.filter((x) => x.day === day)
      const shut = state.shut.has(day)
      const shows = inDay.filter((x) => x.soort === 'voorstelling'), untimed = inDay.filter((x) => !x.start).length
      const facts = [shows.length === 1 ? `<i>●</i> voorstelling <b>${shows[0].start}</b>` : shows.length ? `<i>●</i> <b>${shows.length}</b> voorstellingen` : '', untimed ? `<b>${untimed}</b> zonder tijd` : ''].filter(Boolean).join(' · ')
      body += `<tr class="group ${shut ? 'shut' : ''}" data-day="${day}" tabindex="0" aria-expanded="${!shut}"><td colspan="${span}"><div class="group-in"><span class="group-chev">${icon('chev')}</span><span class="group-day">${r.day}</span><span class="group-date">${r.date}</span><span class="group-count">${inDay.length}</span>${facts ? `<span class="group-fact">${facts}</span>` : ''}<span class="group-total">bezetting ${inDay.reduce((a, x) => a + x.crew[0], 0)}/${inDay.reduce((a, x) => a + x.crew[1], 0)}</span></div></td></tr>`
    }
    n++
    if (state.shut.has(day)) return
    const prod = PRODUCTIES.find((p) => p.id === r.prod)
    const time = r.start ? `<span class="time">${r.start}<span class="end">–${r.end}</span></span>` : `<span class="allday">zonder tijd</span>`
    const venue = !r.venue ? `<span class="muted">—</span>` : r.inherited ? `<span class="inherited" title="Overgenomen van de tourstop">${esc(r.venue)}<span class="via">via tourstop</span></span>` : esc(r.venue)
    const [have, need] = r.crew
    body += `<tr class="row ${state.sel === i ? 'sel' : ''}" data-i="${i}"><td class="num">${n}</td><td>${time}</td><td class="title-cell">${esc(r.title)}</td>
      <td><span class="soort"><i style="background:var(--s-${r.soort})"></i>${SOORT[r.soort]}</span></td>
      ${prodCol ? `<td><span class="prod-tag"><i style="background:${prod.color}"></i>${esc(prod.titel)}</span></td>` : ''}
      <td>${venue}</td><td><span class="pill ${r.status}">${r.status}</span></td>
      <td><span class="crew"><span class="meter"><b style="width:${(have / need) * 100}%"></b></span>${have}/${need}</span></td></tr>`
  })
  $('#grid').innerHTML = head + `<tbody>${body || `<tr><td colspan="${span}" style="height:160px;text-align:center;color:var(--color-fg-subtle)">Geen activiteiten in deze week voor deze productie.</td></tr>`}</tbody>`
  $('#rows').textContent = `${rows.length} rijen`
}
function renderBoard() {
  const scoped = shell.space !== 'all', q = $('#q').value.toLowerCase()
  const rows = ROWS.filter((r) => (!scoped || r.prod === shell.space) && (!q || r.title.toLowerCase().includes(q)) && matches(r)).sort(bySort)
  $('#board').innerHTML = DAYS.map(([day, date]) => {
    const inDay = rows.filter((r) => r.day === day)
    const timed = inDay.filter((r) => r.start).length, need = inDay.reduce((a, r) => a + r.crew[1], 0), have = inDay.reduce((a, r) => a + r.crew[0], 0)
    return `<section class="col"><div class="col-head"><span class="col-label">${icon('cal')}${day} ${date.split(' ')[0]}</span><span class="col-count">${inDay.length}</span><button class="tool" aria-label="Activiteit toevoegen">${icon('plus')}</button></div>
      <div class="col-sum">${timed} met tijd · ${inDay.length - timed} zonder · bezetting ${have}/${need}</div>
      ${inDay.map((r) => {
        const i = ROWS.indexOf(r), prod = PRODUCTIES.find((p) => p.id === r.prod)
        const venue = !r.venue ? '' : `<span class="${r.inherited ? 'inherited' : ''}">${icon('pin')}${esc(r.venue)}</span>`
        return `<article class="card ${r.start ? '' : 'untimed'} ${state.sel === i ? 'sel' : ''}" data-i="${i}">
          <div class="card-kind"><i style="background:var(--s-${r.soort})"></i>${SOORT[r.soort]}${scoped ? '' : ` · ${esc(prod.titel)}`}</div>
          <div class="card-title">${esc(r.title)}</div>
          <div class="card-facts"><span>${icon('clock')}${r.start ? `<span class="time">${r.start}<span class="end">–${r.end}</span></span>` : 'zonder tijd'}</span>${venue}</div>
          <div class="card-foot"><span class="pill ${r.status}">${r.status}</span><span class="crew"><span class="meter"><b style="width:${(r.crew[0] / r.crew[1]) * 100}%"></b></span>${r.crew[0]}/${r.crew[1]}</span></div></article>`
      }).join('') || '<p class="hint">Niets gepland.</p>'}
      <button class="col-add">${icon('plus')}Activiteit toevoegen</button></section>`
  }).join('')
  $('#rows').textContent = `${rows.length} rijen`
}
$('#board').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return
  state.sel = +c.dataset.i; document.querySelectorAll('.card.sel').forEach((x) => x.classList.remove('sel')); c.classList.add('sel')
})
function toggleDay(tr) { const d = tr.dataset.day; state.shut.has(d) ? state.shut.delete(d) : state.shut.add(d); renderMain(); $(`tr.group[data-day="${d}"]`)?.focus() }
$('#grid').addEventListener('keydown', (e) => { const g = e.target.closest('tr.group'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleDay(g) } })
$('#grid').addEventListener('click', (e) => {
  const g = e.target.closest('tr.group'); if (g) return toggleDay(g)
  const tr = e.target.closest('tr.row'); if (!tr) return
  document.querySelectorAll('.cell-focus').forEach((x) => x.classList.remove('cell-focus'))
  state.sel = +tr.dataset.i; document.querySelectorAll('tr.row.sel').forEach((x) => x.classList.remove('sel')); tr.classList.add('sel')
  e.target.closest('td')?.classList.add('cell-focus')
})
$('#q').addEventListener('input', () => renderMain())

// ---------- history and share: icon buttons in the title line ----------
$('#history-btn').addEventListener('click', () => {
  state.sel = -1; renderMain()
  openDrawer(drawer({ kindHtml: `${icon('history')}<span>Geschiedenis</span>`, title: 'Geschiedenis van Planning',
    secs: HISTORY.map(([day, items]) => ({ title: day, html: `<ul class="hist">${items.map(([what, meta, undo]) => `<li>${icon('history')}<span>${what}<span class="t"> · ${meta}</span>${undo ? '<br><button class="undo-l">Ongedaan maken</button>' : ''}</span></li>`).join('')}</ul>` })) }))
})
$('#share-btn').addEventListener('click', (e) => {
  openPop(e.currentTarget, `<div class="pop-head">Exporteren</div><button class="pop-item">${icon('table')}Excel (.xlsx)</button><button class="pop-item">${icon('cal')}Agenda (.ics)</button><div class="pop-sep"></div><div class="pop-head">Delen</div><button class="pop-item">${icon('users')}Link naar deze weergave kopiëren</button><button class="pop-item">${icon('share')}Publiceren…<span class="meta">openbare link</span></button>`, { align: 'right' })
})

// ---------- the record drawer on a row ----------
const shownRows = () => {
  const scoped = shell.space !== 'all', q = $('#q').value.toLowerCase()
  return ROWS.filter((r) => (!scoped || r.prod === shell.space) && (!q || r.title.toLowerCase().includes(q)) && matches(r)).sort(bySort)
}
function rowDrawer(r, list) {
  const p = PRODUCTIES.find((x) => x.id === r.prod), [have, need] = r.crew
  const people = Object.keys(PEOPLE).slice(0, have)
  const venue = !r.venue ? '<span class="muted">—</span>' : r.inherited ? `<span class="inherited">${esc(r.venue)}<span class="via">via tourstop</span></span>` : esc(r.venue)
  return drawer({
    kindHtml: `<span class="soort"><i style="background:var(--s-${r.soort})"></i>${SOORT[r.soort]}</span><span>· Activiteit</span>`,
    pos: list ? `${list.indexOf(r) + 1} van ${list.length}` : '',
    title: r.title,
    sub: `<span class="prod-tag"><i style="background:${p.color}"></i>${esc(p.titel)}</span>${r.venue ? `<span>${icon('pin')} ${esc(r.venue)}</span>` : ''}`,
    props: [
      ['check', 'Status', `<span class="pill ${r.status}">${r.status}</span>`],
      ['tag', 'Soort', `<span class="soort"><i style="background:var(--s-${r.soort})"></i>${SOORT[r.soort]}</span>`],
      ['cal', 'Plandag', `<span class="mono">${r.day.toLowerCase()} ${r.date}</span>`],
      ['clock', 'Tijd', r.start ? `<span class="time">${r.start}<span class="end">–${r.end}</span></span>` : '<span class="allday">zonder tijd</span>'],
      ['pin', 'Locatie', venue],
    ],
    secs: [
      { title: 'Bezetting', n: `${have}/${need}`, right: '+ Toewijzen', html: `<ul class="dw-list">${people.map((k) => `<li>${avatar(k)}<span class="main-t">${esc(PEOPLE[k][0])}<span>${PEOPLE[k][1]}</span></span><span class="pill bevestigd">bevestigd</span></li>`).join('')}${Array.from({ length: need - have }, () => '<li class="open-slot"><span class="avatar open">+</span><span class="main-t">Open plek<span>Speler</span></span><button class="fill">Open plek invullen</button></li>').join('')}</ul>` },
      { title: 'Notities', html: `<p class="note">${r.soort === 'voorstelling' ? 'Zaal open om 19:30. Inlaat via de artiesteningang; parkeren op de laadkade tot 18:00.' : 'Nog geen notities. Klik om er een toe te voegen.'}</p>` },
    ],
  })
}
$('#grid').addEventListener('click', (e) => { const tr = e.target.closest('tr.row'); if (tr) { const list = shownRows(); openDrawer(rowDrawer(list[+tr.dataset.i], list)) } })
$('#board').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openDrawer(rowDrawer(ROWS[+c.dataset.i], null)) })
shell.onClose = () => { state.sel = -1; document.querySelectorAll('tr.row.sel, .card.sel, .cell-focus').forEach((x) => x.classList.remove('sel', 'cell-focus')) }
shell.onSpace = () => renderMain()

// ---------- Bijstellen: the grid's six settings ----------
TWEAKS.unshift(
  { key: 'density', label: 'Rijhoogte', options: [['compact', 'Compact'], ['normal', 'Normaal'], ['roomy', 'Ruim']], value: 'normal', apply: (v) => root.setAttribute('data-density', v) },
  { key: 'layout', label: 'Indeling', options: [['table', 'Tabel'], ['columns', 'Dagkolommen']], value: 'table', apply: (v) => { state.layout = v; state.sel = -1; renderMain() } },
  { key: 'groups', label: 'Dagkop', options: [['band', 'Band'], ['line', 'Lijn']], value: 'band', apply: (v) => root.setAttribute('data-groups', v) },
  { key: 'lines', label: 'Rasterlijnen', options: [['off', 'Uit'], ['on', 'Aan']], value: 'off', apply: (v) => root.setAttribute('data-lines', v) },
  { key: 'zebra', label: 'Zebrarijen', options: [['off', 'Uit'], ['on', 'Aan']], value: 'off', apply: (v) => root.setAttribute('data-zebra', v) },
)
$('#foot').innerHTML = '<span>↑↓←→ bewegen</span><span>↵ bewerken</span><span>⌘Z ongedaan maken</span>'
boot()
for (const key of ['density', 'layout', 'groups', 'lines', 'zebra']) { const v = store.get(key); if (v) setTweak(key, v, false) }
renderMain()
const list = shownRows(), first = list.findIndex((r) => r.soort === 'voorstelling')
state.sel = first; renderMain(); openDrawer(rowDrawer(list[first], list))
})()

</script>
</body>
</html>
